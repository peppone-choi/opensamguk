# pnpm 10 moved settings out of package.json's "pnpm" field into this file (https://pnpm.io/settings).
# Allow the transitive native deps to run build scripts so a fresh CI `pnpm install` builds them
# (sharp = next image optimizer, unrs-resolver = eslint-config-next import resolver). Without this,
# pnpm 10 prints [ERR_PNPM_IGNORED_BUILDS] and the unbuilt natives break `next build`.
onlyBuiltDependencies:
  - sharp
  - unrs-resolver
