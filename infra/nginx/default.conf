# 라이브 prod nginx 설정 (EC2 박스 ~/opensamguk/docker/nginx/default.conf 의 버전관리 정본).
#
# 박스 compose(docker-compose.production.yml)가 `./docker/nginx/default.conf` →
# `/etc/nginx/conf.d/default.conf`(ro)로 마운트한다. deploy.yml이 이 파일을 박스로 scp 동기화 후
# nginx를 force-recreate(업스트림 IP 재해석 + 새 설정 적용)하므로, 라이브 라우팅 변경은 반드시 여기서 한다.
#
# 토폴로지: 서비스명 gateway-frontend(:3000)/game-frontend(:3001)/gateway-api(:18081)/game-api(:18080).
# (주의: 레포 `infra/nginx/nginx.conf`는 로컬/레포 compose 전용의 다른 토폴로지 — web-gateway/8081.
#  박스/레포 compose 수렴은 별도 후속.)
#
# 라우팅:
#  /game, /game/                     → game-frontend(web/game SPA)
#  /api/gateway/                     → gateway-api(인증/프로필)
#  /api/admin/                       → game-api(어드민 read)
#  /api/auth/, /api/proxy/,          → gateway-frontend(Next route handler: 토큰 프록시·서버맵·전황)
#  /api/server-map/, /api/server-log/
#  /api/                             → game-api(게임 read/precheck/intake catch-all, server-* 보다 뒤)
#  /                                 → gateway-frontend(입구/로비)
#
# nginx LAST 재시작 규칙(stale-DNS 502 방지): 업스트림 컨테이너명은 시작/리로드 시 1회 해석되므로,
# 업스트림 recreate 후 nginx는 반드시 마지막에 force-recreate. deploy.yml이 그 순서를 보장한다.

server {
    listen 80;
    server_name _;

    location = /game {
        proxy_pass http://game-frontend:3001/game;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /game/_next/ {
        # 게임 에셋(next.config assetPrefix=/game → /game/_next/*)을 game-frontend의 /_next/*로 strip 전달.
        # 공유 도메인서 gateway-frontend와 /_next 충돌 회피. /game/_next/ 가 /game/ 보다 긴 prefix라 우선.
        proxy_pass http://game-frontend:3001/_next/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /game/ {
        proxy_pass http://game-frontend:3001/game/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/gateway/ {
        proxy_pass http://gateway-api:18081/api/gateway/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/admin/ {
        proxy_pass http://game-api:18080/api/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/auth/ {
        proxy_pass http://gateway-frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/proxy/ {
        proxy_pass http://gateway-frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/server-map/ {
        proxy_pass http://gateway-frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/server-log/ {
        proxy_pass http://gateway-frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/game/ {
        # 인게임 data/SSE는 game-frontend Next route handler를 거쳐야 한다(쿠키→Bearer 부착 후
        # GAME_API_URL로 프록시 + `api/game` prefix strip). /api/ catch-all(→game-api 직송)이
        # 가로채면 game-api가 /api/game/* 404 → 인게임 미작동. 더 긴 prefix라 /api/보다 우선.
        proxy_pass http://game-frontend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_read_timeout 3600s;
    }
    location /api/ {
        proxy_pass http://game-api:18080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://gateway-frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
