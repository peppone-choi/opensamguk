# Production Docker Compose — GCP Compute Engine e2-standard-2 (2 vCPU, 8 GiB RAM)
# Usage: docker compose -f docker-compose.production.yml up -d
name: opensamguk

services:
  postgres:
    image: postgres:16-alpine
    container_name: opensamguk-postgres
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Seoul}
      POSTGRES_DB: ${POSTGRES_DB:-sammo}
      POSTGRES_USER: ${POSTGRES_USER:-sammo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sammo}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - opensamguk
    deploy:
      resources:
        limits:
          memory: 1.5G

  redis:
    image: redis:7-alpine
    container_name: opensamguk-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    environment:
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - opensamguk
    deploy:
      resources:
        limits:
          memory: 300M

  game-engine:
    image: ${GHCR_REGISTRY:-ghcr.io}/${GHCR_OWNER:-opensamguk}/game-engine:${IMAGE_TAG:-latest}
    container_name: opensamguk-game-engine
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Seoul}
      GAME_DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sammo}
      GAME_DB_USER: ${POSTGRES_USER:-sammo}
      GAME_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OPENSAMGUK_WORLD_ID: ${OPENSAMGUK_WORLD_ID:?OPENSAMGUK_WORLD_ID required}
      TURN_PROFILE_NAME: ${TURN_PROFILE_NAME:-che:scenario_2}
      # Production starts empty by default; admins create servers before any scenario seed.
      SCENARIO_SEED_ENABLED: ${SCENARIO_SEED_ENABLED:-false}
      SCENARIO_CODE: ${SCENARIO_CODE:-scenario_1010}
      SCENARIO_DIR: ${SCENARIO_DIR:-/data/scenarios}
      # 어드민/워크플로 리셋이 고른 시나리오 옵션. 값이 여기서 끊기면 옵션이 조용히 버려진다.
      # 기본값은 넣지 않는다 — 미설정의 의미는 SeedBootstrap이 PHP install.php 기본값으로 단독 소유한다.
      RESET_TURNTERM: ${RESET_TURNTERM:-}
      RESET_FICTION: ${RESET_FICTION:-}
      RESET_EXTEND: ${RESET_EXTEND:-}
      RESET_BLOCK_GENERAL_CREATE: ${RESET_BLOCK_GENERAL_CREATE:-}
      RESET_NPCMODE: ${RESET_NPCMODE:-}
      RESET_SHOW_IMG_LEVEL: ${RESET_SHOW_IMG_LEVEL:-}
      # Sentry — 빈 값이면 SDK no-op (서비스별 DSN, .env.example 참조).
      SENTRY_DSN: ${SENTRY_DSN_GAME_ENGINE:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      JAVA_TOOL_OPTIONS: -Duser.timezone=${TZ:-Asia/Seoul}
      JAVA_OPTS: "-XX:+UseG1GC -XX:MaxRAMPercentage=60 -XX:InitialRAMPercentage=40 -Djava.security.egd=file:/dev/./urandom"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8082"
    volumes:
      - ${SCENARIO_HOST_DIR:-./data/scenarios}:${SCENARIO_DIR:-/data/scenarios}:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 4m
    networks:
      - opensamguk
    deploy:
      resources:
        limits:
          memory: 2G

  game-api:
    image: ${GHCR_REGISTRY:-ghcr.io}/${GHCR_OWNER:-opensamguk}/game-api:${IMAGE_TAG:-latest}
    container_name: opensamguk-game-api
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Seoul}
      GAME_DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sammo}
      GAME_DB_USER: ${POSTGRES_USER:-sammo}
      GAME_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      SCENARIO_DIR: ${SCENARIO_DIR:-/data/scenarios}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OPENSAMGUK_WORLD_ID: ${OPENSAMGUK_WORLD_ID:?OPENSAMGUK_WORLD_ID required}
      OPENSAMGUK_PROFILE: ${TURN_PROFILE_NAME:-che:scenario_2}
      SERVER_ID: ${SERVER_ID:-pep}
      SERVER_NAME: ${SERVER_NAME:-통일 서버}
      SERVER_GENERATION: ${SERVER_GENERATION:-1}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY required}
      JWT_LEGACY_SECRET: ${JWT_LEGACY_SECRET:-}
      JWT_LEGACY_ACCESS_ACCEPT_UNTIL: ${JWT_LEGACY_ACCESS_ACCEPT_UNTIL:-}
      # Sentry — 빈 값이면 SDK no-op (서비스별 DSN, .env.example 참조).
      SENTRY_DSN: ${SENTRY_DSN_GAME_API:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      JAVA_TOOL_OPTIONS: -Duser.timezone=${TZ:-Asia/Seoul}
      JAVA_OPTS: "-XX:+UseG1GC -XX:MaxRAMPercentage=50.0 -XX:InitialRAMPercentage=30.0 -Djava.security.egd=file:/dev/./urandom"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8081"
    volumes:
      - ${SCENARIO_HOST_DIR:-./data/scenarios}:${SCENARIO_DIR:-/data/scenarios}:ro
    networks:
      - opensamguk
    deploy:
      resources:
        limits:
          memory: 1.5G

  gateway-api:
    image: ${GHCR_REGISTRY:-ghcr.io}/${GHCR_OWNER:-opensamguk}/gateway-api:${IMAGE_TAG:-latest}
    container_name: opensamguk-gateway-api
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Seoul}
      GAME_DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sammo}
      GAME_DB_USER: ${POSTGRES_USER:-sammo}
      GAME_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      SCENARIO_DIR: ${SCENARIO_DIR:-/data/scenarios}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?JWT_PRIVATE_KEY required}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY required}
      JWT_SIGNING_MODE: ${JWT_SIGNING_MODE:-RS256}
      JWT_LEGACY_SECRET: ${JWT_LEGACY_SECRET:-}
      JWT_LEGACY_ACCESS_ACCEPT_UNTIL: ${JWT_LEGACY_ACCESS_ACCEPT_UNTIL:-}
      JWT_LEGACY_REFRESH_ACCEPT_UNTIL: ${JWT_LEGACY_REFRESH_ACCEPT_UNTIL:-}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-900000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}
      DEPLOYER_URL: ${DEPLOYER_URL:-http://deployer:9000}
      DEPLOYER_TOKEN: ${DEPLOYER_TOKEN:?DEPLOYER_TOKEN required for admin deployer controls}
      SERVER_REGISTRY_JSON: ${SERVER_REGISTRY_JSON:-[]}
      # Admin seed (idempotent on empty users table).
      ADMIN_USERNAME: ${ADMIN_USERNAME:-peppone}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD required}
      # Persistent uploaded profile icons (serving is OPENSAM-93, not this compose change).
      PROFILE_ICON_STORAGE_ROOT: /var/lib/opensamguk/profile-icons
      # Sentry — 빈 값이면 SDK no-op (서비스별 DSN, .env.example 참조).
      SENTRY_DSN: ${SENTRY_DSN_GATEWAY_API:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      JAVA_TOOL_OPTIONS: -Duser.timezone=${TZ:-Asia/Seoul}
      JAVA_OPTS: "-XX:+UseG1GC -XX:MaxRAMPercentage=40.0 -XX:InitialRAMPercentage=25.0 -Djava.security.egd=file:/dev/./urandom"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8080"
    volumes:
      - profile-icons:/var/lib/opensamguk/profile-icons
      - ${SCENARIO_HOST_DIR:-./data/scenarios}:${SCENARIO_DIR:-/data/scenarios}:ro
    networks:
      - opensamguk
    deploy:
      resources:
        limits:
          memory: 512M

  board-api:
    image: ${GHCR_REGISTRY:-ghcr.io}/${GHCR_OWNER:-opensamguk}/board-api:${IMAGE_TAG:-latest}
    container_name: opensamguk-board-api
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Seoul}
      GAME_DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sammo}
      GAME_DB_USER: ${POSTGRES_USER:-sammo}
      GAME_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY required}
      JWT_LEGACY_SECRET: ${JWT_LEGACY_SECRET:-}
      JWT_LEGACY_ACCESS_ACCEPT_UNTIL: ${JWT_LEGACY_ACCESS_ACCEPT_UNTIL:-}
      SENTRY_DSN: ${SENTRY_DSN_BOARD_API:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      JAVA_TOOL_OPTIONS: -Duser.timezone=${TZ:-Asia/Seoul}
      JAVA_OPTS: "-XX:+UseG1GC -XX:MaxRAMPercentage=40.0 -XX:InitialRAMPercentage=25.0 -Djava.security.egd=file:/dev/./urandom"
    depends_on:
      postgres:
        condition: service_healthy
      gateway-api:
        condition: service_healthy
    expose:
      - "8083"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - opensamguk
    deploy:
      resources:
        limits:
          memory: 512M

  web-gateway:
    image: ${GHCR_REGISTRY:-ghcr.io}/${GHCR_OWNER:-opensamguk}/web-gateway:${IMAGE_TAG:-latest}
    container_name: opensamguk-web-gateway
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Seoul}
      NODE_ENV: production
      PORT: 3000
      # Server-only proxy target (NEXT_PUBLIC_GAME_URL is baked into the image at build).
      GATEWAY_API_URL: ${GATEWAY_API_URL:-http://gateway-api:8080}
      BOARD_API_URL: ${BOARD_API_URL:-http://board-api:8083}
      GAME_API_ORIGIN: ${GAME_API_ORIGIN:-http://game-api:8081}
      SERVER_ID: ${SERVER_ID:-pep}
      SERVER_REGISTRY_JSON: ${SERVER_REGISTRY_JSON:-[]}
    depends_on:
      - gateway-api
      - board-api
    expose:
      - "3000"
    networks:
      - opensamguk
    deploy:
      resources:
        limits:
          memory: 256M

  web-game:
    image: ${GHCR_REGISTRY:-ghcr.io}/${GHCR_OWNER:-opensamguk}/web-game:${IMAGE_TAG:-latest}
    container_name: opensamguk-web-game
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Seoul}
      NODE_ENV: production
      PORT: 3001
      SERVER_ID: ${SERVER_ID:-pep}
      GAME_API_URL: ${GAME_API_URL:-http://game-api:8081}
      GATEWAY_API_URL: ${GATEWAY_API_URL:-http://gateway-api:8080}
    depends_on:
      - game-api
      - gateway-api
      - game-engine
    expose:
      - "3001"
    networks:
      - opensamguk
    deploy:
      resources:
        limits:
          memory: 256M

  nginx:
    image: nginx:1.27-alpine
    container_name: opensamguk-nginx
    restart: unless-stopped
    volumes:
      - ${COMPOSE_HOST_DIR:-${PWD:-.}}/infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # OPENSAM-93: same-origin /d_pic/ read-only serving of gateway-api managed profile icons.
      # SAME named volume gateway-api writes to, mounted READ-ONLY here — gateway-api stays the sole
      # writer. Path matches nginx.conf's `location /d_pic/` alias root. Kept identical to the local
      # docker-compose.yml mount contract.
      - profile-icons:/var/lib/opensamguk/profile-icons:ro
      - nginx-cache:/var/cache/nginx
    depends_on:
      - gateway-api
      - board-api
      - game-api
      - game-engine
      - web-gateway
      - web-game
    ports:
      - "80:80"
      - "443:443"
    networks:
      - opensamguk
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  profile-icons:
    driver: local
  nginx-cache:
    driver: local

networks:
  opensamguk:
    driver: bridge
