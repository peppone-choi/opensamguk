# opensamguk — turnkey LOCAL dev stack.
#
#   git pull && cp .env.example .env && docker compose up --build
#
# Brings up the FULL stack: postgres, redis, the three Kotlin/Spring services
# (gateway-api:8080, game-api:8081, game-engine:8082), both Next.js fronts
# (web-gateway:3000, web-game:3001) and an nginx reverse proxy on :80 that
# reuses infra/nginx/nginx.conf for same-origin routing.
#
# First `up` against an EMPTY DB seeds itself:
#   - game-engine  → ScenarioSeedRunner imports scenario_1010 (174 generals) when world_state is empty
#   - gateway-api  → AdminSeeder creates ADMIN_USERNAME when both admin env values are set
# Both are idempotent: a second `up` is a no-op on already-seeded data (volumes persist it).
#
# JWT: JWT_SECRET is defined ONCE in .env and wired to BOTH gateway-api (issuer,
# JwtTokenProvider) AND game-api (verifier, GameApiJwtVerifier). They MUST share
# the exact same BASE64 HS256 secret or game-api rejects every gateway-issued token.
#
# Production overrides live on the server — see docker-compose.production.yml.
name: opensamguk

services:
  # ------------------------------------------------------------------ data
  postgres:
    image: postgres:16-alpine
    container_name: opensamguk-postgres
    environment:
      TZ: ${TZ:-Asia/Seoul}
      POSTGRES_DB: ${POSTGRES_DB:-sammo}
      POSTGRES_USER: ${POSTGRES_USER:-sammo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sammo}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sammo} -d ${POSTGRES_DB:-sammo}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - opensamguk

  redis:
    image: redis:7-alpine
    container_name: opensamguk-redis
    command: redis-server --appendonly yes
    environment:
      TZ: ${TZ:-Asia/Seoul}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 3s
    networks:
      - opensamguk

  # ------------------------------------------------------------- jvm services
  gateway-api:
    build:
      context: .
      dockerfile: docker/gateway-api.Dockerfile
    container_name: opensamguk-gateway-api
    environment:
      TZ: ${TZ:-Asia/Seoul}
      GAME_DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sammo}
      GAME_DB_USER: ${POSTGRES_USER:-sammo}
      GAME_DB_PASSWORD: ${POSTGRES_PASSWORD:-sammo}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GATEWAY_API_PORT: 8080
      # JWT — gateway-api ISSUES tokens with this secret (shared with game-api).
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required — see .env.example}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-900000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}
      DEPLOYER_URL: ${DEPLOYER_URL:-}
      DEPLOYER_TOKEN: ${DEPLOYER_TOKEN:-}
      SERVER_REGISTRY_JSON: ${SERVER_REGISTRY_JSON:-"[]"}
      # Admin seed (gateway-api AdminSeeder, idempotent on empty users table).
      ADMIN_USERNAME: ${ADMIN_USERNAME:-peppone}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      JAVA_TOOL_OPTIONS: -Duser.timezone=${TZ:-Asia/Seoul}
      JAVA_OPTS: ${GATEWAY_API_JAVA_OPTS:--XX:+UseG1GC -Djava.security.egd=file:/dev/./urandom}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${GATEWAY_API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - opensamguk

  game-api:
    build:
      context: .
      dockerfile: docker/game-api.Dockerfile
    container_name: opensamguk-game-api
    environment:
      TZ: ${TZ:-Asia/Seoul}
      GAME_DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sammo}
      GAME_DB_USER: ${POSTGRES_USER:-sammo}
      GAME_DB_PASSWORD: ${POSTGRES_PASSWORD:-sammo}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GAME_API_PORT: 8081
      OPENSAMGUK_PROFILE: ${TURN_PROFILE_NAME:-che:scenario_2}
      SERVER_ID: ${SERVER_ID:-s1}
      SERVER_NAME: ${SERVER_NAME:-통일 서버}
      SERVER_GENERATION: ${SERVER_GENERATION:-1}
      # JWT — game-api VERIFIES tokens issued by gateway-api. SAME secret, verify-only.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required — see .env.example}
      JAVA_TOOL_OPTIONS: -Duser.timezone=${TZ:-Asia/Seoul}
      JAVA_OPTS: ${GAME_API_JAVA_OPTS:--XX:+UseG1GC -Djava.security.egd=file:/dev/./urandom}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${GAME_API_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - opensamguk

  game-engine:
    build:
      context: .
      dockerfile: docker/game-engine.Dockerfile
    container_name: opensamguk-game-engine
    environment:
      TZ: ${TZ:-Asia/Seoul}
      GAME_DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sammo}
      GAME_DB_USER: ${POSTGRES_USER:-sammo}
      GAME_DB_PASSWORD: ${POSTGRES_PASSWORD:-sammo}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GAME_ENGINE_PORT: 8082
      TURN_PROFILE_NAME: ${TURN_PROFILE_NAME:-che:scenario_2}
      # Scenario seed (ScenarioSeedRunner, idempotent on empty world_state).
      SCENARIO_SEED_ENABLED: ${SCENARIO_SEED_ENABLED:-true}
      SCENARIO_CODE: ${SCENARIO_CODE:-scenario_1010}
      SCENARIO_DIR: ${SCENARIO_DIR:-/data/scenarios}
      JAVA_TOOL_OPTIONS: -Duser.timezone=${TZ:-Asia/Seoul}
      JAVA_OPTS: ${GAME_ENGINE_JAVA_OPTS:--XX:+UseG1GC -Djava.security.egd=file:/dev/./urandom}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${GAME_ENGINE_PORT:-8082}:8082"
    volumes:
      - ${SCENARIO_HOST_DIR:-./data/scenarios}:${SCENARIO_DIR:-/data/scenarios}:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    networks:
      - opensamguk

  # --------------------------------------------------------------- web fronts
  web-gateway:
    build:
      context: .
      dockerfile: docker/web-gateway.Dockerfile
      args:
        # NEXT_PUBLIC_* is inlined into the client bundle at BUILD time.
        NEXT_PUBLIC_GAME_URL: ${NEXT_PUBLIC_GAME_URL:-http://localhost:3001}
    container_name: opensamguk-web-gateway
    environment:
      TZ: ${TZ:-Asia/Seoul}
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      # Session-cookie Secure flag. Default false so login works over HTTP (local/LAN compose on
      # :80/:3000). Set COOKIE_SECURE=true ONLY behind HTTPS (else the browser drops the cookie and
      # login bounces back to /login).
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Server-only (route handlers proxy to gateway-api; never exposed to the browser).
      GATEWAY_API_URL: ${GATEWAY_API_URL:-http://gateway-api:8080}
      # 맵 프리뷰/현황 프록시 대상(해당 서버 game-api 내부 주소). servers.json gameApiUrl은 dev 기본값
      # localhost:8081이라 컨테이너 안에선 자기참조→502 → 컨테이너망 DNS로 오버라이드.
      GAME_API_ORIGIN: ${GAME_API_ORIGIN:-http://game-api:8081}
      SERVER_REGISTRY_JSON: ${SERVER_REGISTRY_JSON:-"[]"}
    depends_on:
      gateway-api:
        condition: service_healthy
    ports:
      - "${WEB_GATEWAY_PORT:-3000}:3000"
    networks:
      - opensamguk

  web-game:
    build:
      context: .
      dockerfile: docker/web-game.Dockerfile
      args:
        # NEXT_PUBLIC_* is inlined into the client bundle at BUILD time.
        NEXT_PUBLIC_GATEWAY_URL: ${NEXT_PUBLIC_GATEWAY_URL:-http://localhost:3000}
    container_name: opensamguk-web-game
    environment:
      TZ: ${TZ:-Asia/Seoul}
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3001
      # Server-only (route handlers proxy to game-api/gateway-api; never exposed to the browser).
      GAME_API_URL: ${GAME_API_URL:-http://game-api:8081}
      GATEWAY_API_URL: ${GATEWAY_API_URL:-http://gateway-api:8080}
    depends_on:
      game-api:
        condition: service_healthy
      gateway-api:
        condition: service_healthy
      game-engine:
        condition: service_healthy
    ports:
      - "${WEB_GAME_PORT:-3001}:3001"
    networks:
      - opensamguk

  # ------------------------------------------------------------------- proxy
  nginx:
    image: nginx:1.27-alpine
    container_name: opensamguk-nginx
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway-api
      - game-api
      - game-engine
      - web-gateway
      - web-game
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    networks:
      - opensamguk

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local

networks:
  opensamguk:
    driver: bridge
