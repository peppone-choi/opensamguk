services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sammo
      POSTGRES_USER: sammo
      POSTGRES_PASSWORD: sammo
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sammo"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway-api:
    build:
      context: .
      dockerfile: docker/gateway-api.Dockerfile
    environment:
      REDIS_HOST: redis
    depends_on:
      redis: { condition: service_healthy }
    ports: ["8080:8080"]

  game-api:
    build:
      context: .
      dockerfile: docker/game-api.Dockerfile
    environment:
      GAME_DATABASE_URL: jdbc:postgresql://postgres:5432/sammo
      GAME_DB_USER: sammo
      GAME_DB_PASSWORD: sammo
      REDIS_HOST: redis
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["8081:8081"]

  game-engine:
    build:
      context: .
      dockerfile: docker/game-engine.Dockerfile
    environment:
      GAME_DATABASE_URL: jdbc:postgresql://postgres:5432/sammo
      GAME_DB_USER: sammo
      GAME_DB_PASSWORD: sammo
      REDIS_HOST: redis
      TURN_PROFILE_NAME: "che:scenario_2"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["8082:8082"]

  web-gateway:
    build:
      context: .
      dockerfile: docker/web-gateway.Dockerfile
    ports: ["3000:3000"]

  web-game:
    build:
      context: .
      dockerfile: docker/web-game.Dockerfile
    ports: ["3001:3001"]

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [gateway-api, game-api, web-gateway, web-game]
    ports: ["80:80"]
