spring:
  application:
    name: game-api
  datasource:
    url: ${GAME_DATABASE_URL:jdbc:postgresql://localhost:5432/sammo}
    username: ${GAME_DB_USER:sammo}
    password: ${GAME_DB_PASSWORD:sammo}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholders:
      scenario_dir: ${SCENARIO_DIR:}
    postgresql:
      # V29+ CREATE INDEX CONCURRENTLY용. 기본값(트랜잭션형 advisory lock)은 Flyway가 잠금
      # 커넥션을 idle-in-transaction으로 유지해 CONCURRENTLY가 그 트랜잭션을 영원히 기다리는
      # 데드락을 만든다(V29 마이그레이션 IT에서 실증). 세션 락으로 전환해야 통과한다.
      transactional-lock: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
jwt:
  # MUST be the SAME HS256 secret gateway-api signs access tokens with (env JWT_SECRET, BASE64).
  # game-api only VERIFIES — it never issues. The default matches gateway-api's dev default so the
  # two services validate the same dev tokens out of the box.
  secret: ${JWT_SECRET:Y2hhbmdlbWUtY2hhbmdlbWUtY2hhbmdlbWUtY2hhbmdlbWUtY2hhbmdlbWU=}
opensamguk:
  world-id: ${OPENSAMGUK_WORLD_ID}
  profile: ${OPENSAMGUK_PROFILE:che:scenario_2}
  read-barrier:
    max-wait-ms: ${OPENSAMGUK_READ_BARRIER_MAX_WAIT_MS:400}
    poll-interval-ms: ${OPENSAMGUK_READ_BARRIER_POLL_INTERVAL_MS:25}
    retry-after-ms: ${OPENSAMGUK_READ_BARRIER_RETRY_AFTER_MS:150}
    pool:
      max-size: ${OPENSAMGUK_READ_BARRIER_POOL_MAX_SIZE:4}
      connection-timeout-ms: ${OPENSAMGUK_READ_BARRIER_POOL_CONNECTION_TIMEOUT_MS:250}
server:
  port: ${GAME_API_PORT:8081}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
# Sentry — 에러 캡처 전용(traces-sample-rate 0 고정, 3앱 공통). DSN 미설정(빈 값)이면
# SDK 전체 no-op — 프론트(enabled: !!dsn)와 동일 설계. 기존 동작 무변경이 기본값.
sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  traces-sample-rate: 0.0
  send-default-pii: false
