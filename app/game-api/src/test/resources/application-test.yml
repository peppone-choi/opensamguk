spring:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    postgresql:
      # V29 CREATE INDEX CONCURRENTLY × Flyway 트랜잭션형 advisory lock 데드락 방지 (세션 락 전환)
      transactional-lock: false
