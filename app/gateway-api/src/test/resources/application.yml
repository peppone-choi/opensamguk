spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379
  servlet:
    multipart:
      max-file-size: 50KB
      max-request-size: 64KB

profile-icon:
  storage-root: /tmp/opensamguk-profile-icons-test
  max-bytes: 51200
  zone-id: Asia/Seoul
  shared-manifest: profile-icons/shared-manifest.json

jwt:
  secret: dGVzdC1zZWNyZXQta2V5LWZvci10ZXN0aW5nLW9ubHktdGVzdC1zZWNyZXQ=
  access-expiration: 900000
  refresh-expiration: 604800000
