spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379
  servlet:
    multipart:
      max-file-size: 50KB
      max-request-size: 64KB

profile-icon:
  # Must be free of symlinked ancestors on every platform: the production
  # canonicalStorageRoot guard rejects a symlinked ancestor, and on macOS /tmp
  # is a symlink to /private/tmp. Resolve under the module build dir instead.
  storage-root: build/test-profile-icons
  max-bytes: 51200
  zone-id: Asia/Seoul
  shared-manifest: profile-icons/shared-manifest.json

jwt:
  legacy-secret: dGVzdC1zZWNyZXQta2V5LWZvci10ZXN0aW5nLW9ubHktdGVzdC1zZWNyZXQ=
  legacy-access-accept-until: 2099-01-01T00:00:00Z
  legacy-refresh-accept-until: 2099-01-01T00:00:00Z
  signing-mode: LEGACY_HS256
  access-expiration: 900000
  refresh-expiration: 604800000
