spring:
  application:
    name: gateway-api
  datasource:
    url: ${GAME_DATABASE_URL:jdbc:postgresql://localhost:5432/sammo}
    username: ${GAME_DB_USER:sammo}
    password: ${GAME_DB_PASSWORD:sammo}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholders:
      scenario_dir: ${SCENARIO_DIR:}
    postgresql:
      # V29+ CREATE INDEX CONCURRENTLY용. 기본값(트랜잭션형 advisory lock)은 Flyway가 잠금
      # 커넥션을 idle-in-transaction으로 유지해 CONCURRENTLY가 그 트랜잭션을 영원히 기다리는
      # 데드락을 만든다(V29 마이그레이션 IT에서 실증). 세션 락으로 전환해야 통과한다.
      transactional-lock: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  servlet:
    multipart:
      max-file-size: 50KB
      max-request-size: 64KB
      resolve-lazily: false
jwt:
  secret: ${JWT_SECRET:Y2hhbmdlbWUtY2hhbmdlbWUtY2hhbmdlbWUtY2hhbmdlbWUtY2hhbmdlbWU=}
  access-expiration: ${JWT_ACCESS_EXPIRATION:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

server:
  port: ${GATEWAY_API_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

profile-icon:
  storage-root: ${PROFILE_ICON_STORAGE_ROOT:/var/lib/opensamguk/profile-icons}
  max-bytes: 51200
  zone-id: Asia/Seoul
  shared-manifest: profile-icons/shared-manifest.json
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
# Sentry — 에러 캡처 전용(traces-sample-rate 0 고정, 3앱 공통). DSN 미설정(빈 값)이면
# SDK 전체 no-op — 프론트(enabled: !!dsn)와 동일 설계. 기존 동작 무변경이 기본값.
sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  traces-sample-rate: 0.0
  send-default-pii: false
