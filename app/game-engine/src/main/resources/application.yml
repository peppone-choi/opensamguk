spring:
  application:
    name: game-engine
  datasource:
    url: ${GAME_DATABASE_URL:jdbc:postgresql://localhost:5432/sammo}
    username: ${GAME_DB_USER:sammo}
    password: ${GAME_DB_PASSWORD:sammo}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholders:
      scenario_dir: ${SCENARIO_DIR:}
    postgresql:
      # V29+ CREATE INDEX CONCURRENTLY용. 기본값(트랜잭션형 advisory lock)은 Flyway가 잠금
      # 커넥션을 idle-in-transaction으로 유지해 CONCURRENTLY가 그 트랜잭션을 영원히 기다리는
      # 데드락을 만든다(V29 마이그레이션 IT에서 실증). 세션 락으로 전환해야 통과한다.
      transactional-lock: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
server:
  port: ${GAME_ENGINE_PORT:8082}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
opensamguk:
  world-id: ${OPENSAMGUK_WORLD_ID}
  profile: ${TURN_PROFILE_NAME:che:scenario_2}
# Sentry — 에러 캡처 전용. traces-sample-rate는 0 고정: 턴 데몬 핫루프(InMemoryTurnWorld 턴 처리)에
# 트레이싱 계측을 싣지 않는다. DSN 미설정(빈 값)이면 SDK 전체 no-op — 프론트(enabled: !!dsn)와 동일 설계.
sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  traces-sample-rate: 0.0
  send-default-pii: false
