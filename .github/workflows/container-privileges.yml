name: Container privileges
on:
  pull_request:
    paths:
      - 'docker/**'
      - 'docker-compose.production.yml'
      - 'tools/ci/check_container_privileges.py'
      - '.github/workflows/container-privileges.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: container-privileges-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        surface: [board-api, game-api, game-engine, gateway-api, web-game, web-gateway]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: python3 -m pip install PyYAML==6.0.3
      - name: Check declared privileges
        run: python3 tools/ci/check_container_privileges.py
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.surface }}.Dockerfile
          load: true
          tags: privileges:${{ matrix.surface }}
          cache-from: type=gha,scope=privileges-${{ matrix.surface }}
          cache-to: type=gha,mode=max,scope=privileges-${{ matrix.surface }}
      - name: Verify real image UID, hardening, boot, writes and static files
        run: |
          set -o pipefail
          python3 tools/ci/check_container_privileges.py --surface '${{ matrix.surface }}' --image 'privileges:${{ matrix.surface }}' 2>&1 | tee container-privileges.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-privileges-${{ matrix.surface }}
          path: container-privileges.log
