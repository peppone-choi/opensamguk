name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    # 5 분으로는 모자란다 — 縣 51 곳이 城으로 서면서 han-tiles 가 커져 tools/map 스위트
    # 한 단계만으로 5 분을 넘겼다(런 34574079528, 첫 단계에서 취소). 로컬 실측 약 11 분.
    # 2026-09-18 실측: 통과한 런이 20m6s(#815)라 25분은 여유가 없다 — #823·#824 가 실패 없이 취소됐다.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Han map test dependencies
        run: python3 -m pip install numpy==2.4.6 Pillow==12.2.0 PyYAML==6.0.3
      # Every step below runs with `!cancelled()`: a step failing must not hide
      # whether the rest are green (2026-08-24 — a failing step near the top of
      # this job silently skipped everything after it, including the unittest
      # discover that PRs #517/#519 both needed CI evidence for). Not
      # `always()` — a cancelled job still shouldn't keep grinding.
      - name: Verify Han map data contract tests
        if: '!cancelled()'
        # 느린 두 파일은 map-slow-tests 잡이 병렬로 돈다(2026-09-18 로컬 실측: 전체 2,045초 중
        # test_build_han_parent_reconciliation 888초 + test_territory_disconnection_adjudications 797초).
        # 빼는 이름이 실제 파일이 아니면 실패한다 — 이름이 바뀌어 아무 데서도 안 도는 일을 막는다.
        run: |
          slow="test_build_han_parent_reconciliation test_territory_disconnection_adjudications"
          for t in $slow; do test -f "tools/map/tests/$t.py" || { echo "slow test missing: $t" >&2; exit 1; }; done
          grep -c "^          - test_" .github/workflows/ci.yml | grep -qx 2 || { echo "map-slow-tests matrix must list exactly the 2 excluded files" >&2; exit 1; }
          for t in $slow; do grep -q "^          - $t$" .github/workflows/ci.yml || { echo "excluded but not in map-slow-tests matrix: $t" >&2; exit 1; }; done
          files=$(ls tools/map/tests/test_*.py | grep -v -e test_build_han_parent_reconciliation.py -e test_territory_disconnection_adjudications.py)
          python3 -m unittest $files
      - name: Test march tempo simulator (tools/sim)
        if: '!cancelled()'
        run: python3 -m unittest discover -s tools/sim/tests -p 'test_*.py'
      # Every disconnected commandery/county piece in han-tiles.json must have a
      # reviewed row (exclave / island / grid defect / misassignment) with the
      # evidence its verdict needs. The ledger never moves cells; it only records
      # what may stay and what a later parent-ledger PR has to fix.
      - name: Verify Han territory disconnection ledger
        if: '!cancelled()'
        run: python3 tools/map/audit_territory_disconnections.py --check
      - name: Verify Han supply disagreements (fail closed)
        if: '!cancelled()'
        run: python3 tools/scenario/audit_han_supply_disagreements.py --map han-world-v3 --check
      # 위 게이트는 두 보급 모델의 **불일치**만 본다 — 둘 다 「끊겼다」에 동의하면 무료 통과다.
      # 그래서 공융이 16城 중 14城을 개시부터 잃은 채로 초록이었다. 이 게이트가 그 절대 축이다.
      - name: Verify scenario seed supply reachability (baseline pinned)
        if: '!cancelled()'
        run: python3 tools/scenario/audit_scenario_seed_supply.py --check
      # ADR-LITE-051 — 郡 내부 보급선. 이 산출물이 낡거나 비면 공융의 北海國 이 다시 끊긴다.
      - name: Verify commandery supply links
        if: '!cancelled()'
        run: python3 tools/map/build_commandery_supply_links.py --check
      # 철·말·목재 산지 원장(GH #776). 커밋된 추출본을 han-tiles 에 다시 붙여 커밋본과 비교한다 —
      # 縣이 생기거나 郡이 바뀌면 빨개진다. 사료 원문(data/corpus)은 gitignore 라 여기서 다시 뽑지 않는다.
      - name: Resource-site ledger is current
        if: '!cancelled()'
        run: python3 tools/map/build_resource_sites.py --check
      # GH #542 — external-places.json 은 입력이 **Wikidata SPARQL(네트워크)** 하나뿐이라 두 축으로 나눈다.
      #   1) --check-offline (fail closed): 생성기의 PLACES 표가 네트워크 없이 정하는 필드(kind·level·
      #      jun·prov·basis·presLoc·conf·hub·id)와 행 집합·_meta·직렬화를 커밋된 산출물과 대조한다.
      #      #542 가 실측한 「魯國 kind=COMMANDERY 인 채로 커밋」이 바로 이 축이다(적색 프로브로 확인).
      #   2) --check (경고): Wikidata 로 재생성해 바이트 대조. 좌표·QID 의 낡음은 여기서만 보인다.
      #      공개 엔드포인트의 502/504 나 제3자의 Wikidata 편집이 무관한 PR 을 죽이면 안 되므로 job 을
      #      죽이지 않는다 — 대신 「드리프트(1)」와 「조회 실패라 판정 불가(2)」를 갈라서 경고한다.
      - name: Verify external places table vs artifact (offline, fail closed)
        if: '!cancelled()'
        run: python3 tools/map/build_external_places.py --check-offline
      - name: Verify reviewed Han route candidate regeneration
        if: '!cancelled()'
        run: python3 tools/scenario/build_han_route_node_candidates.py --output data/curated/han/route-node-selection-candidates-v1.json --check
      # 변경 縣 51 곳(交趾·九真·日南·遼東·玄菟·樂浪·遼東屬國)은 han-tiles 에 縣 구획으로 서 있다.
      # 결정론 재생성이라 --check 가 곧 드리프트 게이트다 — 원장(frontier-county-placements-v1)의
      # priorStage 로 이전 단계를 복원해 다시 세우고 바이트 비교한다(약 35초).
      - name: Verify frontier county materialization
        if: '!cancelled()'
        run: python3 tools/map/materialize_frontier_counties.py --check
      # 省 → 城 귀속 원장. 한 縣이 여러 省을 가지고 城이 없는 縣도 239 곳이라, 인접 간선을
      # 省의 cityIndex 로만 풀면 그래프가 성분 36 개로 쪼개진다(실측). 결정론 재생성이라
      # --check 가 곧 드리프트 게이트다.
      - name: Verify province to city attribution ledger
        if: '!cancelled()'
        run: python3 tools/scenario/build_province_city_attribution.py --check
      # OPENSAM-255 — 인물 본관 縣 원장. 입력은 전부 커밋된 파일이다(등록부·이름표·시나리오·글자표·
      # 추출 원장·han-tiles). 사료 색인은 저장소 밖이라 --extract 는 CI 에서 돌지 않는다 — 추출 원장이 증거다.
      - name: Verify officer native county ledger
        if: '!cancelled()'
        run: python3 tools/scenario/build_officer_native_county.py --check
      - name: Verify new-world Han V3 artifacts
        if: '!cancelled()'
        run: python3 tools/scenario/build_han_world.py --target han-world-v3 --check
      - name: Verify reviewed Han water topology (activation remains evidence-gated)
        if: '!cancelled()'
        run: |
          python3 tools/map/build_han_water_topology.py --check
          python3 tools/map/audit_han_water_topology.py --check
      - name: Verify scenario data contract tests
        if: '!cancelled()'
        run: python3 -m unittest discover -s tools/scenario/tests -p 'test_*.py'
      - name: Verify RTK14 scenario materializer contracts
        if: '!cancelled()'
        run: python3 -m unittest tools/rtk14/test_build_rtk14_stats.py
      # tools/agent-system/ no longer holds the agent harness checker, but it
      # does hold check_test_xml.py — the guard the jvm job below calls to fail
      # the build when Docker-gated IT silently skip (#517). Its tests must keep
      # running here; the harness removal deleted check.py only.
      - name: Verify agent-system tool tests
        if: '!cancelled()'
        run: python3 -m unittest discover -s tools/agent-system/tests -p 'test_*.py'
      - name: Verify HanGateIndex.kt drift
        # `build_han_world.py --check` (full 3-artifact check) needs
        # data/map/junguozhi.json, which is gitignored by design
        # (ADR-LITE-039: CHGIS-derived coordinate data, no-redistribution
        # license) and NEVER present in a checkout — CI included. A bare
        # `--check` call would be permanently RED on every PR, not a real
        # gate (GH #534 investigation, 2026-08-24).
        #
        # HanGateIndex.kt itself does NOT depend on junguozhi.json/CHE though.
        # `--check-gate` derives keys against the committed runtime han.json
        # city IDs, using only TILES/han.json/UNITS (all tracked). It must not
        # independently apply a newer CANON_105 ordering: until all three
        # world artifacts are regenerated together, that would misalign gate
        # IDs with HanCityConst/han.json. HanCityConst.kt
        # /han.json drift (which DOES need junguozhi.json) is still not
        # CI-gated — verify those manually before merging changes to
        # build_han_world.py or its inputs.
        if: '!cancelled()'
        run: python3 tools/scenario/build_han_world.py --check-gate
      - name: Warn on ungated HanCityConst.kt/han.json drift
        # HanCityConst.kt/han.json (unlike HanGateIndex.kt above) genuinely
        # need data/map/junguozhi.json (gitignored, ADR-LITE-039) and are not
        # CI-gated. Never fails the job -- this is a visibility signal, not a
        # gate: the point is to surface the limitation loudly in the CI
        # log/UI instead of leaving it in a YAML comment nobody reads
        # (2026-08-24 independent critique of GH #534's own first commit,
        # dede1024, which had this warning and lost it when --check-gate
        # replaced the guarded skip). See GH #536.
        if: '!cancelled()'
        run: |
          if [ -f data/map/junguozhi.json ]; then
            python3 tools/scenario/build_han_world.py --check \
              || echo "::warning::HanCityConst.kt/han.json drift detected (see --check output above). Not failing this job -- see GH #536."
          else
            echo "::warning::data/map/junguozhi.json is gitignored (ADR-LITE-039) and absent from this checkout -- HanCityConst.kt/han.json drift is NOT verified here (GH #536). Verify manually (regenerate junguozhi.json locally via tools/map/build_junguozhi.py, then run build_han_world.py --check) before merging changes to build_han_world.py or its inputs."
          fi
      - name: Verify county economy inputs (data/curated/han/county-economy-inputs-v1.json drift)
        # 입력은 전부 커밋본(han-tiles.json · han-world-v3.json · administrative-units.json · params).
        # 적색 프로브: tools/map/tests/test_build_county_economy_inputs.py CheckGateRedProbeTest.
        if: '!cancelled()'
        run: python3 tools/map/build_county_economy_inputs.py --check
      - name: Verify Junguozhi county gap ledger (name match vs han-tiles jurisdictions)
        # 입력은 전부 커밋본. 적색 프로브: tools/map/tests/test_build_junguozhi_county_gaps.py.
        if: '!cancelled()'
        run: python3 tools/map/build_junguozhi_county_gaps.py --check
      # han-tiles.json·han-world-v3.json 에 묶인 커밋 산출물의 결합 목록을 한 번에 돈다(GH #818). 개별 스텝과
      # 겹치지만(약 25초) 중간에 멈추지 않고 낡은 산출물을 전부 지목하고 재생성 명령을 찍는다. 목록의
      # 완전성·배선은 tools/map/tests/test_check_han_tiles_coupled.py 가 지킨다. slow 항목은 위 개별 스텝.
      - name: Verify han-tiles coupled artifacts (batch, names every stale artifact)
        if: '!cancelled()'
        run: python3 tools/map/check_han_tiles_coupled.py --check
      - name: Verify unitset build (data/unitset/units.json drift)
        # build_unitset.py's only input is data/unitset/units.json itself
        # (authored table fields -> derived numeric fields, same file) --
        # tracked, no gitignore barrier, unlike build_han_world.py (#534).
        # Deterministic (verified: two consecutive runs byte-identical) and
        # was never wired into CI -- same "gate exists, nobody calls it"
        # shape as #534/#521. Ceiling: it only catches a missed regen (the
        # derived fields not matching the authored ones) -- it re-derives
        # from whatever is currently authored in units.json, so a wrong
        # authored value that's been regenerated through this script reads
        # as GREEN forever. This is not a correctness gate on the data,
        # only a "did you forget to rerun the generator" gate.
        if: '!cancelled()'
        run: python3 tools/unitset/build_unitset.py --check
      - name: Verify Han route-node selection materialization
        if: '!cancelled()'
        run: python3 tools/scenario/materialize_han_route_node_selection.py --check
      - name: Verify Han route-node selection validator
        if: '!cancelled()'
        run: python3 tools/scenario/validate_han_route_node_selection.py
      - name: Verify Han lowland terrain reclassification stage
        # 저지 지형 재분류 단계(han-tiles 최상단)를 벗겼다 다시 얹어, 검토 원장(이름 붙은 저지·표고 기준)과
        # 커밋된 ETOPO1 표고에서 커밋된 han-tiles.json 의 terrain 이 그대로 재현되는지 본다. owner 가 움직였거나
        # 결정 원장·표고 PNG 해시가 바뀌어도 잡는다. 아래 접기·분할 검사는 이 단계를 먼저 벗기고 돈다.
        if: '!cancelled()'
        run: python3 tools/map/reclassify_han_lowland_terrain.py --check
      - name: Verify Han cityless-jurisdiction fold stage
        # 城 없는 관할 접기·省 이관 단계(han-tiles 최상단)를 벗겼다 다시 얹어 원장의 행·출력 digest 가 커밋된
        # han-tiles.json 과 바이트 단위로 같은지 본다. 결정 원장 해시 변경도 잡는다.
        if: '!cancelled()'
        run: python3 tools/map/fold_cityless_jurisdictions.py --check
      - name: Verify Han strategic-site province carve stage
        # 수·진·관 거점 省 분할 단계(han-tiles 최상단)를 벗겼다 다시 얹어 원장의 배치·셀 델타·출력 digest 가
        # 커밋된 han-tiles.json 과 바이트 단위로 같은지 본다. 원장 입력(거점 원장) 해시 변경도 잡는다.
        if: '!cancelled()'
        run: python3 tools/map/carve_strategic_site_provinces.py --check
      - name: Verify Han world scenario materialization
        if: '!cancelled()'
        run: python3 tools/scenario/apply_han_world.py --map han-world-v3 --check
      - name: Verify v2 sandbox compose contract
        if: '!cancelled()'
        run: bash tools/ops/v2_sandbox_compose_contract_test.sh
      - name: Verify JWT rollout contract
        if: '!cancelled()'
        run: python3 tools/ops/jwt_rollout_contract_test.py
      - name: Verify deploy service inventory contract
        if: '!cancelled()'
        run: python3 tools/ops/test_deploy_service_inventory_contract.py
      - name: Verify source deploy maintenance admission
        if: '!cancelled()'
        run: python3 tools/ops/test_source_deploy_maintenance.py
      - name: Verify game server recovery behavioral guards
        if: '!cancelled()'
        run: python3 tools/ops/test_game_server_recovery.py
      - name: Verify main CI red/recovery alert decisions
        if: '!cancelled()'
        run: python3 tools/ops/test_main_ci_alert.py
      - name: Verify game-server reset workflow contract
        if: '!cancelled()'
        run: bash tools/ops/wait_deployer_operation_contract_test.sh
      - name: Verify local compose service graph
        if: '!cancelled()'
        run: docker compose --env-file .env.example config --quiet

  # GH #542 경고 축. contracts 에 두면 Wikidata 가 멈출 때 고아 프로세스가 25분 한도를 먹어 contracts 가
  # 통째로 취소됐다(런 35305964557: 「Terminate orphan process: timeout / python3」). 결과에 영향 없는
  # 경고이므로 자기 잡·자기 한도로 떼어 둔다 — 실패해도(continue-on-error) 다른 잡을 막지 않는다.
  map-slow-tests:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        test:
          - test_build_han_parent_reconciliation
          - test_territory_disconnection_adjudications
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Han map test dependencies
        run: python3 -m pip install numpy==2.4.6 Pillow==12.2.0 PyYAML==6.0.3
      - name: Run ${{ matrix.test }}
        run: python3 -m unittest tools/map/tests/${{ matrix.test }}.py
      - name: Verify regenerated parent reconciliation ledger
        if: matrix.test == 'test_build_han_parent_reconciliation'
        run: python3 tools/map/build_han_parent_reconciliation.py --check

  external-places-drift:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 12
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Warn on external places Wikidata drift (network, never fails the job)
        # 엔드포인트가 거절 없이 멈추면 재시도 합이 12분을 넘는다. 스텝 타임아웃은 셸 밖에서 실패 처리되므로
        # 셸의 timeout 으로 먼저 끊어 종료 코드(124)로 받고 경고로 보낸다. 아래 둘은 그래도 남는 경우의 안전망이다.
        run: |
          set +e
          timeout --signal=TERM --kill-after=15 540 python3 tools/map/build_external_places.py --check
          rc=$?
          case "$rc" in
            0) ;;
            1) echo "::warning::data/map/external-places.json drifted from a live Wikidata regeneration (coordinates/QIDs). Regenerate with tools/map/build_external_places.py and review the diff. Not failing this job -- GH #542." ;;
            124|137) echo "::warning::Wikidata regeneration timed out after 9 minutes -- external-places.json coordinate drift was NOT verified in this run (GH #542). The offline table gate above still ran." ;;
            *) echo "::warning::Wikidata SPARQL unreachable (exit $rc) -- external-places.json coordinate drift was NOT verified in this run (GH #542). The offline table gate above still ran." ;;
          esac
          exit 0

  jvm:
    runs-on: ubuntu-latest
    # OPENSAM-221 (GH #487): 상한이 없으면 Flyway CONCURRENTLY 데드락 같은 무한 대기가
    # 러너 기본 상한(6시간)까지 붙잡고 배포 파이프 전체를 세운다.
    # 2026-09-18 실측: 「~9분」은 옛 수치다. :app:game-engine:test 혼자 ~30분(main 35313733459: 06:11→06:41),
    # 빌드 전체 31m37s. logic 을 건드린 PR 은 캐시가 안 맞아 앞단이 4–6분 더 돌고 40분 한도에 걸려
    # 테스트 실패 없이 취소됐다(#815 두 번, #820 세 번). 한도는 매달림을 끊는 용도라 여유를 둔다.
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Refuse the skipped-IT opt-out in CI
        # OPENSAM_ALLOW_SKIPPED_IT is a local-only escape hatch for developers
        # iterating without Docker. ubuntu-latest
        # always has Docker, so this var has no legitimate reason to be set
        # here — if it is, something (workflow edit, secret, cached env) is
        # trying to silence the skip gate. Fail loud instead of trusting it.
        run: |
          if [ -n "${OPENSAM_ALLOW_SKIPPED_IT:-}" ]; then
            echo "OPENSAM_ALLOW_SKIPPED_IT is set in CI — this is not allowed. CI must never silence skipped IT." >&2
            exit 1
          fi
      - name: Build + test (Testcontainers uses the runner's Docker)
        run: ./gradlew build --no-daemon
      - name: Fail on skipped tests (docker-gated IT must not silently skip in CI)
        # OPENSAM_ALLOW_SKIPPED_IT is intentionally never set here: ubuntu-latest
        # ships Docker, so any assumeTrue(dockerAvailable) skip in CI means Docker
        # actually became unavailable on the runner and must be investigated, not
        # waved through by a BUILD SUCCESSFUL that never ran the IT. Pinned empty
        # here (not just refused in the prior step) so an env: block added
        # anywhere else in this job can't quietly re-introduce the opt-out.
        #
        # One known, permanent, ticket-registered exception passes through this gate:
        # LongSimReplayGateTest's PHP-golden replay test (tools/agent-system/skipped_it_quarantine.json).
        # It can never run here — its candidate data needs legacy/devsam-core, which is
        # git-ignored and absent from every CI checkout — see LongSimReplayGateTest.kt's
        # class doc and #521 before attempting to wire it in.
        env:
          OPENSAM_ALLOW_SKIPPED_IT: ""
        run: |
          python3 tools/agent-system/check_test_xml.py \
            common logic infra app/gateway-api app/game-api app/game-engine app/board-api
      - name: Surface test results
        if: always()
        run: |
          echo "== test summary =="
          # 모듈별 XML 개수를 먼저 낸다. head 로 자른 전체 목록만 찍으면 결과가 0건인
          # 모듈이 잘림에 묻혀 보이지 않는다(2026-08-21 game-api 매달림 진단이 그래서
          # 늦어졌다). 목록은 그 뒤에 붙인다.
          for m in common logic infra app/gateway-api app/game-api app/game-engine app/board-api; do
            printf '%-22s %s\n' "$m" "$(find "$m" -path '*/build/test-results/*/*.xml' 2>/dev/null | wc -l)"
          done
          find . -path '*/build/test-results/*/*.xml' -print > /tmp/xml-list.txt 2>/dev/null || true
          head -50 /tmp/xml-list.txt || true
      - name: Upload game-engine test failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: game-engine-test-failures
          if-no-files-found: warn
          path: |
            app/game-engine/build/reports/tests/
            app/game-engine/build/test-results/test/
      - name: Upload HWIHA S3 gate traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hwiha-s3-gate-traces-attempt-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            app/game-engine/build/test-results/test/TEST-*HwihaS3PassChain*.xml
            app/game-engine/build/test-results/test/TEST-*HwihaYuzhouCampaignSimulationTest.xml

  web:
    runs-on: ubuntu-latest
    # build 만 돌 때 game 1m54s · gateway 1m39s 였다. vitest 를 더하면서 15 로 올린다
    # (로컬 실측 game 707 건 47s · gateway 266 건 27s). 한도 초과는 실패 로그가 아니라
    # 취소로 나타나 원인을 찾기 어렵다.
    timeout-minutes: 15
    strategy:
      matrix:
        app: [gateway, game]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - name: Install + build web/${{ matrix.app }}
        working-directory: web/${{ matrix.app }}
        run: |
          corepack pnpm install --no-frozen-lockfile
          corepack pnpm build
      # 2026-09-21: 이 잡은 여태 build 만 돌렸다. 두 앱 모두 "test": "vitest run" 을 갖고
      # 있었는데 아무도 안 돌려서, web/game 은 지도 판이 바뀌는 동안 낡은 핀 4 건을 안고
      # 빨간 채로 main 에 남아 있었다(web/shared 와 같은 원인 — 5b130608 · 2288e886).
      # game 의 지도 테스트는 커밋된 정본(han-tiles.json · han.json)을 읽으므로 이것도
      # 지도 데이터 커밋을 막는 게이트다.
      - name: Test web/${{ matrix.app }} (vitest)
        if: '!cancelled()'
        working-directory: web/${{ matrix.app }}
        run: corepack pnpm test

  # web/shared(@opensamguk/ui)의 vitest 는 2026-09-21 까지 어느 잡에서도 돌지 않았다.
  # 위 web 잡은 build 만 돌고, web/game·web/gateway 의 vitest include 는 각 앱 디렉터리
  # 기준이라 web/shared/src/__tests__/** 를 집지 않는다. 그 사이 지도 판이 세 번 바뀌며
  # (4318dc64 → 5b130608 → 2288e886) 실측 핀 5 건이 낡은 채 main 에 남았다.
  # 이 스위트는 커밋된 지도 정본(han-world-v3.json · han-tiles.json · han.json)을 읽어
  # 표기 규칙과 省 도장 찍기를 검사하므로, 지도 데이터 커밋을 막는 게이트이기도 하다.
  web-shared:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - name: Install web/shared
        working-directory: web/shared
        run: corepack pnpm install --no-frozen-lockfile
      - name: Typecheck web/shared
        if: '!cancelled()'
        working-directory: web/shared
        run: corepack pnpm typecheck
      - name: Test web/shared (vitest)
        if: '!cancelled()'
        working-directory: web/shared
        run: corepack pnpm test
