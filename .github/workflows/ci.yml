name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  agent-system:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check provider-agnostic agent working system
        run: python3 tools/agent-system/check.py --strict --base origin/main
      # Every step below runs with `!cancelled()`: a step failing must not hide
      # whether the rest are green (2026-08-24 — check.py failing at the step
      # above silently skipped everything after it, including the unittest
      # discover that PRs #517/#519 both needed CI evidence for). Not
      # `always()` — a cancelled job still shouldn't keep grinding.
      - name: Verify Han map data contract tests
        if: '!cancelled()'
        run: python3 -m unittest discover -s tools/map/tests -p 'test_*.py'
      - name: Verify scenario data contract tests
        if: '!cancelled()'
        run: python3 -m unittest discover -s tools/scenario/tests -p 'test_*.py'
      - name: Verify agent-system tool tests
        if: '!cancelled()'
        run: python3 -m unittest discover -s tools/agent-system/tests -p 'test_*.py'
      - name: Verify Han world build artifacts (HanGateIndex.kt/HanCityConst.kt/han.json drift)
        # build_han_world.py --check needs data/map/junguozhi.json, which is
        # gitignored by design (ADR-LITE-039: CHGIS-derived coordinate data,
        # no-redistribution license) and NEVER present in a checkout — CI
        # included. A bare `--check` call here would be permanently RED on
        # every PR, not a real gate (GH #534 investigation, 2026-08-24). Guard
        # on the file so this activates on its own if that ever changes;
        # until then it fails loudly (::warning::) instead of silently
        # passing or blocking merges — HanGateIndex.kt/HanCityConst.kt/
        # han.json drift must be checked manually (`python3
        # tools/scenario/build_han_world.py --check`, with junguozhi.json
        # regenerated locally via tools/map/build_junguozhi.py) before
        # merging changes that touch build_han_world.py or its inputs.
        if: '!cancelled()'
        run: |
          if [ -f data/map/junguozhi.json ]; then
            python3 tools/scenario/build_han_world.py --check
          else
            echo "::warning::data/map/junguozhi.json is gitignored (ADR-LITE-039) and absent from this checkout — build_han_world.py --check cannot run in CI (GH #534). HanGateIndex.kt/HanCityConst.kt/han.json drift is NOT gated here; verify manually."
          fi
      - name: Verify Han route-node candidates
        if: '!cancelled()'
        run: python3 tools/scenario/han_route_node_candidates.py --check
      - name: Verify Han route-node selection
        if: '!cancelled()'
        run: python3 tools/scenario/han_route_node_selection.py --check
      - name: Verify Han route-node selection validator
        if: '!cancelled()'
        run: python3 tools/scenario/validate_han_route_node_selection.py
      - name: Verify v2 sandbox compose contract
        if: '!cancelled()'
        run: bash tools/ops/v2_sandbox_compose_contract_test.sh
      - name: Verify JWT rollout contract
        if: '!cancelled()'
        run: python3 tools/ops/jwt_rollout_contract_test.py
      - name: Verify deploy service inventory contract
        if: '!cancelled()'
        run: python3 tools/ops/test_deploy_service_inventory_contract.py
      - name: Verify local compose service graph
        if: '!cancelled()'
        run: docker compose --env-file .env.example config --quiet

  jvm:
    runs-on: ubuntu-latest
    # OPENSAM-221 (GH #487): 상한이 없으면 Flyway CONCURRENTLY 데드락 같은 무한 대기가
    # 러너 기본 상한(6시간)까지 붙잡고 배포 파이프 전체를 세운다. 실측 정상 소요는 ~9분.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Refuse the skipped-IT opt-out in CI
        # OPENSAM_ALLOW_SKIPPED_IT is a local-only escape hatch for developers
        # iterating without Docker (docs/agent/verification.md). ubuntu-latest
        # always has Docker, so this var has no legitimate reason to be set
        # here — if it is, something (workflow edit, secret, cached env) is
        # trying to silence the skip gate. Fail loud instead of trusting it.
        run: |
          if [ -n "${OPENSAM_ALLOW_SKIPPED_IT:-}" ]; then
            echo "OPENSAM_ALLOW_SKIPPED_IT is set in CI — this is not allowed. CI must never silence skipped IT." >&2
            exit 1
          fi
      - name: Build + test (Testcontainers uses the runner's Docker)
        run: ./gradlew build --no-daemon
      - name: Fail on skipped tests (docker-gated IT must not silently skip in CI)
        # OPENSAM_ALLOW_SKIPPED_IT is intentionally never set here: ubuntu-latest
        # ships Docker, so any assumeTrue(dockerAvailable) skip in CI means Docker
        # actually became unavailable on the runner and must be investigated, not
        # waved through by a BUILD SUCCESSFUL that never ran the IT. Pinned empty
        # here (not just refused in the prior step) so an env: block added
        # anywhere else in this job can't quietly re-introduce the opt-out.
        env:
          OPENSAM_ALLOW_SKIPPED_IT: ""
        run: |
          python3 tools/agent-system/check_test_xml.py \
            common logic infra app/gateway-api app/game-api app/game-engine app/board-api
      - name: Surface test results
        if: always()
        run: |
          echo "== test summary =="
          # 모듈별 XML 개수를 먼저 낸다. head 로 자른 전체 목록만 찍으면 결과가 0건인
          # 모듈이 잘림에 묻혀 보이지 않는다(2026-08-21 game-api 매달림 진단이 그래서
          # 늦어졌다). 목록은 그 뒤에 붙인다.
          for m in common logic infra app/gateway-api app/game-api app/game-engine app/board-api; do
            printf '%-22s %s\n' "$m" "$(find "$m" -path '*/build/test-results/*/*.xml' 2>/dev/null | wc -l)"
          done
          find . -path '*/build/test-results/*/*.xml' -print > /tmp/xml-list.txt 2>/dev/null || true
          head -50 /tmp/xml-list.txt || true

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        app: [gateway, game]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - name: Install + build web/${{ matrix.app }}
        working-directory: web/${{ matrix.app }}
        run: |
          corepack pnpm install --no-frozen-lockfile
          corepack pnpm build
