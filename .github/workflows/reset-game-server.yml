name: Reset exact pep preserving exposure and map (no backup)

on:
  workflow_dispatch:
    inputs:
      scenario_code:
        description: Prepared approved scenario code
        type: string
        required: true
        default: scenario_3190

permissions:
  contents: read
  actions: read
  packages: write

jobs:
  pep:
    uses: ./.github/workflows/pep-reset.yml
    with:
      scenario_code: ${{ inputs.scenario_code }}
    secrets: inherit
