name: pep loop offline contracts

on:
  pull_request:
    paths:
      - tools/ops/pep_loop.py
      - tools/ops/test_pep_loop.py
      - tools/ops/pep_scenarios.py
      - tools/ops/test_pep_scenarios.py
      - app/gateway-api/src/main/resources/scenario-reset-catalog.json
      - .github/workflows/pep-*.yml
      - .github/workflows/deploy.yml
      - .github/workflows/promote-game-server.yml
      - .github/workflows/reset-game-server.yml
  push:
    branches: [main]
    paths:
      - tools/ops/pep_loop.py
      - tools/ops/test_pep_loop.py
      - tools/ops/pep_scenarios.py
      - tools/ops/test_pep_scenarios.py
      - app/gateway-api/src/main/resources/scenario-reset-catalog.json
      - .github/workflows/pep-*.yml
      - .github/workflows/deploy.yml
      - .github/workflows/promote-game-server.yml
      - .github/workflows/reset-game-server.yml

permissions:
  contents: read

jobs:
  pep-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tools/ops -p test_pep_loop.py -v
      - run: python3 -m unittest discover -s tools/ops -p test_pep_scenarios.py -v
      - name: Workflow syntax
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -ignore label.*gcp-prod.*unknown .github/workflows/pep-loop.yml .github/workflows/pep-refresh.yml .github/workflows/pep-reset.yml .github/workflows/pep-loop-test.yml .github/workflows/deploy.yml .github/workflows/promote-game-server.yml .github/workflows/reset-game-server.yml
