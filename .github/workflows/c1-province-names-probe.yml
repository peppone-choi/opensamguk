name: C1 구역 이름표 보안 회귀 검증

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - app/game-api/src/main/kotlin/opensamguk/gameapi/security/GameApiSecurityConfig.kt
      - app/game-api/src/test/kotlin/opensamguk/gameapi/security/ProvinceNamesMatcherSecurityChainTest.kt
      - tools/ci/province_names_contract_probe.py
      - .github/workflows/c1-province-names-probe.yml

permissions:
  contents: read

jobs:
  province-names-probe:
    if: github.event.pull_request.number == 1115
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: 실제 matcher 적색·바이트 원복·JWT·HotCold 검증
        run: |
          python3 tools/ci/province_names_contract_probe.py \
            --root "$GITHUB_WORKSPACE" --head "${{ github.event.pull_request.head.sha }}" \
            --evidence "$RUNNER_TEMP/c1-province-names-evidence" --execute
      - name: 원본 XML·classpath·소스 지문 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c1-province-names-probe-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: ${{ runner.temp }}/c1-province-names-evidence/
