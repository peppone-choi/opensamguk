name: Build operator and map surfaces

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Merged main commit to build (full lowercase SHA)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        surface: [gateway-api, web-gateway, web-game]
    steps:
      - name: Validate source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: '[[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Confirm merged source and successful CI
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ inputs.source_sha }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          python3 tools/ci/wait_for_main_ci.py
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.surface }}.Dockerfile
          push: true
          platforms: linux/amd64
          tags: ghcr.io/peppone-choi/opensamguk:${{ matrix.surface }}-${{ inputs.source_sha }}
          build-args: |
            IMAGE_TAG=${{ inputs.source_sha }}
            NEXT_PUBLIC_GATEWAY_URL=https://sam.peppone.dev
            NEXT_PUBLIC_GAME_URL=https://sam.peppone.dev/game
            NEXT_PUBLIC_TOPDOWN_SCREENS=1
          cache-from: type=gha,scope=operator-${{ matrix.surface }}
          cache-to: type=gha,mode=max,scope=operator-${{ matrix.surface }}
          provenance: mode=max
