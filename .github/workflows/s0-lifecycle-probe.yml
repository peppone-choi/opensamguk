name: S0 lifecycle diagnosis
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run deterministic early completion and SSE regressions
        run: ./gradlew :app:game-api:test --tests 'opensamguk.admissionstreamtest.ServerAdmissionSseHttpTest' --tests 'opensamguk.gameapi.sse.RealtimeRelayAdmissionTest' --no-daemon --max-workers=2
      - name: Reject skipped tests
        run: python3 tools/agent-system/check_test_xml.py app/game-api
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s0-lifecycle-xml
          path: app/game-api/build/test-results/test/TEST-*.xml
          if-no-files-found: error
