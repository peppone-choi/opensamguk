name: G6 turn order DROP_HOOK probe

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/ci.yml'
      - '.github/workflows/g6-turn-order-probe.yml'
      - 'app/game-engine/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g6-red-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  drop-hook:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Run isolated DROP_HOOK (nonzero exit is only a candidate RED)
        run: |
          mkdir -p build/g6-evidence/red
          rm -rf app/game-engine/build/test-results/test app/game-engine/build/reports/g6-turn-order
          set +e
          OPENSAMGUK_G6_PROBE=DROP_HOOK ./gradlew :app:game-engine:test --tests opensamguk.engine.invariance.G6TurnOrderMetricTest --rerun-tasks --no-daemon --max-workers=2 2>&1 | tee build/g6-evidence/red/gradle.log
          codes=("${PIPESTATUS[@]}")
          printf '%s\n' "${codes[0]}" > build/g6-evidence/red/exit-code.txt
          test "${codes[1]}" -eq 0
      - name: Validate exact cardinality RED, settlement and missing metric rows
        if: always()
        run: |
          mkdir -p build/g6-evidence/red
          python3 - <<'PYTHON'
          import hashlib, json, os, shutil, subprocess
          import xml.etree.ElementTree as ET
          from pathlib import Path
          out = Path("build/g6-evidence/red")
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          record = {"mode": "DROP_HOOK", "headSha": head, "runId": os.environ["GITHUB_RUN_ID"], "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"], "expectedFailureValidated": False}
          try:
              assert head == os.environ["EXPECTED_HEAD"], "checkout head mismatch"
              code = int((out / "exit-code.txt").read_text())
              record["gradleExitCode"] = code
              assert code != 0, "DROP_HOOK unexpectedly passed"
              xml = Path("app/game-engine/build/test-results/test/TEST-opensamguk.engine.invariance.G6TurnOrderMetricTest.xml")
              shutil.copy2(xml, out / xml.name)
              metrics = list(Path("app/game-engine/build/reports/g6-turn-order").glob("*.json"))
              assert metrics, "missing RED metrics: compile/infrastructure failure is not expected RED"
              for metric in metrics:
                  shutil.copy2(metric, out / metric.name)
              cases = ET.parse(xml).getroot().findall("testcase")
              assert len(cases) == 6, "missing test execution"
              expected = {"real encounter yields one ordered metric row", "same input yields byte identical rows", "defender without personal turn has explicit absent ordinal"}
              # The permanent negative control catches its own assertion and must PASS.
              names = {c.attrib["name"].removesuffix("()") for c in cases}
              assert names == expected | {"no encounter produces no metric rows", "unavailable and disbanded encounters produce no metric rows", "permanent negative control dropped hook fails the same cardinality assertion"}
              seen = set()
              for case in cases:
                  name = case.attrib["name"].removesuffix("()")
                  assert case.find("skipped") is None and case.find("error") is None, "skip/error is not cardinality RED"
                  failures = case.findall("failure")
                  if name in expected:
                      assert len(failures) == 1, f"missing expected failure: {name}"
                      failure = failures[0]
                      detail = failure.attrib.get("message", "") + (failure.text or "")
                      assert "Assertion" in failure.attrib.get("type", ""), detail
                      assert "G6 one resolved encounter must produce exactly one metric row" in detail, detail
                      assert "expected: <1> but was: <0>" in detail, detail
                      seen.add(name)
                  else:
                      assert not failures, f"unrelated failure: {name}"
              assert seen == expected, "cardinality failure set mismatch"
              required = {"encounter", "determinism-a", "determinism-b", "defender-not-due", "drop-hook-negative-control", "no-encounter", "unavailable", "disbanded"}
              assert {p.stem for p in metrics} == required, "metric set mismatch"
              assert all(json.loads(p.read_text()) == [] for p in metrics), "DROP_HOOK metric rows must be absent"
              # assertOneEncounter reaches cardinality only AFTER battleRecordPresent=true
              # and resolutions.count(Resolved)==1. These exact failures prove settlement
              # survived hook removal; fixture source is bound to headSha above.
              record.update(expectedFailureValidated=True, tests=len(cases), skipped=0, cardinalityFailures=sorted(seen), battleRecordPresent=True, resolvedCount=1, metricRows=0)
          finally:
              record["files"] = {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in out.iterdir() if p.is_file() and p.name != "manifest.json"}
              (out / "manifest.json").write_text(json.dumps(record, indent=2) + "\n")
          PYTHON
      - name: Always upload isolated RED evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g6-red-${{ github.event.pull_request.head.sha || github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: build/g6-evidence/red/
          if-no-files-found: error
          retention-days: 14
