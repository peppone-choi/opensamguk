name: Promote Game Server

on:
  workflow_dispatch:
    inputs:
      server:
        description: "Public game server id to promote (canonicalized to lowercase)"
        required: true
        default: "all"
        type: string
      tag:
        description: "Git ref that is also the immutable GHCR image tag (normally commit SHA)"
        required: true
        type: string
      include_engine:
        description: "Restart game-engine as well as stateless services"
        required: true
        default: true
        type: boolean

concurrency:
  group: promote-game-server
  cancel-in-progress: false

jobs:
  promote:
    runs-on: [self-hosted, Linux, X64, gcp-prod]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Promote selected game server
        shell: bash
        env:
          RTK14_STATS_JSON_B64: ${{ secrets.RTK14_STATS_JSON_B64 }}
          INPUT_SERVER: ${{ inputs.server }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_INCLUDE_ENGINE: ${{ inputs.include_engine }}
        run: |
          set -euo pipefail
          exec 9>/tmp/opensamguk-production.lock
          if ! flock -w 1800 9; then
            echo "ERROR: timed out after 1800 seconds waiting for /tmp/opensamguk-production.lock" >&2
            exit 1
          fi

          STACK="$HOME/opensamguk-docker"
          SCENARIO_OUTPUT_DIR="$STACK/data/scenarios"
          RAW_SERVER="$INPUT_SERVER"
          TAG="$INPUT_TAG"
          INCLUDE_ENGINE="$INPUT_INCLUDE_ENGINE"

          if [[ ! "$TAG" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid tag: $TAG" >&2
            exit 2
          fi
          case "$INCLUDE_ENGINE" in
            true|false) ;;
            *) echo "Invalid include_engine: $INCLUDE_ENGINE" >&2; exit 2 ;;
          esac

          if [[ ! "$RAW_SERVER" =~ ^[A-Za-z0-9]+$ ]]; then
            echo "Invalid public server id: $RAW_SERVER" >&2
            exit 2
          fi
          PUBLIC_SERVER="${RAW_SERVER,,}"

          cd "$STACK"
          if [[ "$PUBLIC_SERVER" == "all" ]]; then
            mapfile -t INTERNAL_SERVERS < <(
              find servers -maxdepth 1 -type f -name 's*.env' \
                -exec basename {} .env \; | sort
            )
            PUBLIC_SERVERS=()
            for internal_server in "${INTERNAL_SERVERS[@]}"; do
              public_server="${internal_server#s}"
              if [[ "$public_server" == "all" ]]; then
                echo "Reserved public server id in env file: servers/${internal_server}.env" >&2
                exit 2
              fi
              if [[ ! "$public_server" =~ ^[a-z0-9]+$ ]]; then
                echo "Invalid or noncanonical game server env file: servers/${internal_server}.env" >&2
                exit 2
              fi
              PUBLIC_SERVERS+=("$public_server")
            done
          else
            PUBLIC_SERVERS=("$PUBLIC_SERVER")
          fi

          if [[ "${#PUBLIC_SERVERS[@]}" -eq 0 ]]; then
            echo "No game servers found"
            exit 0
          fi

          materialize_rtk14_scenarios() {
            if [[ -z "${RTK14_STATS_JSON_B64:-}" ]]; then
              if compgen -G "$SCENARIO_OUTPUT_DIR/scenario_*.json" >/dev/null; then
                echo "RTK14_STATS_JSON_B64 is not set; retaining existing external scenario directory"
              else
                echo "RTK14_STATS_JSON_B64 is not set and no external scenarios exist; classpath fallback will be used"
              fi
              return 0
            fi
            rm -rf "$SCENARIO_OUTPUT_DIR"
            mkdir -p "$SCENARIO_OUTPUT_DIR"
            local rtk_source_json
            rtk_source_json="$(mktemp)"
            printf '%s' "$RTK14_STATS_JSON_B64" | base64 -d | gzip -dc > "$rtk_source_json"
            python3 "$GITHUB_WORKSPACE/tools/rtk14/build_rtk14_stats.py" \
              --rtk-source-json "$rtk_source_json" \
              --scenario-dir "$GITHUB_WORKSPACE/infra/src/main/resources/scenario" \
              --out-dir "$SCENARIO_OUTPUT_DIR"
            rm -f "$rtk_source_json"
            chmod 700 "$SCENARIO_OUTPUT_DIR"
            chmod 600 "$SCENARIO_OUTPUT_DIR"/scenario_*.json
            echo "RTK14 local scenario directory materialized: ${SCENARIO_OUTPUT_DIR}"
          }

          ensure_scenario_env() {
            local envf="$1"
            if sudo grep -q '^SCENARIO_HOST_DIR=' "$envf"; then
              sudo sed -i "s|^SCENARIO_HOST_DIR=.*|SCENARIO_HOST_DIR=./data/scenarios|" "$envf"
            else
              printf 'SCENARIO_HOST_DIR=./data/scenarios\n' | sudo tee -a "$envf" >/dev/null
            fi
            if sudo grep -q '^SCENARIO_DIR=' "$envf"; then
              sudo sed -i "s|^SCENARIO_DIR=.*|SCENARIO_DIR=/data/scenarios|" "$envf"
            else
              printf 'SCENARIO_DIR=/data/scenarios\n' | sudo tee -a "$envf" >/dev/null
            fi
          }

          materialize_rtk14_scenarios

          wait_container_health() {
            local container="$1"
            local port="$2"
            for i in $(seq 1 36); do
              if docker exec "$container" wget -qO- "http://localhost:${port}/actuator/health" 2>/dev/null | grep -q '"status":"UP"'; then
                echo "${container} health: OK"
                return 0
              fi
              echo "${container} health pending (${i}/36)"
              sleep 5
            done
            echo "${container} health: FAILED" >&2
            docker logs --tail 160 "$container" || true
            return 1
          }

          wait_public_route() {
            local sid="$1"
            for i in $(seq 1 24); do
              if curl -fsSI "http://localhost/game/${sid}" >/dev/null; then
                echo "${sid} public route: OK"
                return 0
              fi
              echo "${sid} public route pending (${i}/24)"
              sleep 5
            done
            echo "${sid} public route: FAILED" >&2
            docker logs --tail 120 opensamguk-nginx || true
            return 1
          }

          for public_server in "${PUBLIC_SERVERS[@]}"; do
            internal_server="s${public_server}"
            envf="servers/${internal_server}.env"
            project="opensamguk-${internal_server}"
            if [[ ! -f "$envf" ]]; then
              echo "Missing env file: $envf" >&2
              exit 3
            fi

            echo "=== ${public_server} (${internal_server}): pin IMAGE_TAG/WEB_GAME_TAG -> ${TAG} ==="
            sudo sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${TAG}/" "$envf"
            if sudo grep -q '^WEB_GAME_TAG=' "$envf"; then
              sudo sed -i "s/^WEB_GAME_TAG=.*/WEB_GAME_TAG=${TAG}/" "$envf"
            else
              printf 'WEB_GAME_TAG=%s\n' "$TAG" | sudo tee -a "$envf" >/dev/null
            fi

            ensure_scenario_env "$envf"

            echo "=== ${public_server}: pull selected images ==="
            if [[ "$INCLUDE_ENGINE" == "true" ]]; then
              docker compose -p "$project" -f docker-compose.server.yml --env-file "$envf" pull game-engine game-api web-game
              echo "=== ${public_server}: restart full server stack including game-engine ==="
              docker compose -p "$project" -f docker-compose.server.yml --env-file "$envf" up -d
            else
              docker compose -p "$project" -f docker-compose.server.yml --env-file "$envf" pull game-api web-game
              echo "=== ${public_server}: restart stateless services only ==="
              docker compose -p "$project" -f docker-compose.server.yml --env-file "$envf" up -d --force-recreate --no-deps game-api web-game
            fi

            echo "=== ${public_server}: verify containers ==="
            wait_container_health "${internal_server}-game-api" 8081
            wait_container_health "${internal_server}-game-engine" 8082
            wait_public_route "$public_server"

            docker inspect "${internal_server}-game-api" "${internal_server}-game-engine" "${internal_server}-web-game" \
              --format '{{.Name}} {{.Config.Image}}'
          done
