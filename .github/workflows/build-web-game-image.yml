name: Build web-game candidate image

on:
  workflow_dispatch:
    inputs:
      expected_issuer_sha:
        description: Approved workflow and issuer tool revision (lowercase full40)
        required: true
        type: string
      expected_source_sha:
        description: Execution-time main (lowercase full40, explicitly fixed before issuance)
        required: true
        type: string
      expected_source_inputs_sha256:
        description: Reviewed nine-input SHA256 fingerprint (lowercase full64)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: web-game-candidate-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  admit:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      issuer_sha: ${{ steps.guard.outputs.issuer_sha }}
      source_sha: ${{ steps.guard.outputs.source_sha }}
      source_inputs_sha256: ${{ steps.guard.outputs.source_inputs_sha256 }}
      issuer_tool_sha256: ${{ steps.guard.outputs.issuer_tool_sha256 }}
      admission_evidence: ${{ steps.guard.outputs.admission_evidence }}
    steps:
      - name: Admit exact approved issuer and source before any checkout
        id: guard
        env:
          EXPECTED_ISSUER_SHA: ${{ inputs.expected_issuer_sha }}
          ACTUAL_ISSUER_SHA: ${{ github.workflow_sha }}
          SOURCE_SHA: ${{ inputs.expected_source_sha }}
          SOURCE_INPUTS_SHA256: ${{ inputs.expected_source_inputs_sha256 }}
          ACTUAL_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, re, urllib.request
          expected = os.environ['EXPECTED_ISSUER_SHA']
          actual = os.environ['ACTUAL_ISSUER_SHA']
          source = os.environ['SOURCE_SHA']
          fingerprint = os.environ['SOURCE_INPUTS_SHA256']
          if not re.fullmatch(r'[0-9a-f]{40}', expected):
              raise SystemExit('expected issuer SHA must be lowercase full40')
          if not re.fullmatch(r'[0-9a-f]{40}', actual) or actual != expected:
              raise SystemExit('workflow SHA differs from approved issuer')
          if not re.fullmatch(r'[0-9a-f]{40}', source):
              raise SystemExit('expected source SHA must be lowercase full40')
          if not re.fullmatch(r'[0-9a-f]{64}', fingerprint):
              raise SystemExit('expected nine-input fingerprint must be lowercase full64')
          if os.environ['ACTUAL_REPOSITORY'] != 'peppone-choi/opensamguk':
              raise SystemExit('issuer repository mismatch')
          # Load the immutable issuer at I through readonly GitHub contents.
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          url = 'https://api.github.com/repos/peppone-choi/opensamguk/contents/tools/ci/web_game_image.py?ref=' + actual
          req = urllib.request.Request(url, headers={'Accept': 'application/vnd.github+json',
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'User-Agent': 'opensamguk-issuer-admission',
              'X-GitHub-Api-Version': '2022-11-28'})
          try:
              with urllib.request.build_opener(NoRedirect).open(req, timeout=20) as response:
                  data = response.read(256 * 1024 + 1)
              if len(data) > 256 * 1024:
                  raise ValueError()
              value = json.loads(data)
              if not isinstance(value, dict) or value.get('path') != 'tools/ci/web_game_image.py' or value.get('type') != 'file' or value.get('encoding') != 'base64' or not isinstance(value.get('content'), str):
                  raise ValueError()
              raw = base64.b64decode(''.join(value['content'].split()), validate=True)
              blob = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
              if type(value.get('size')) is not int or len(raw) != value['size'] or len(raw) > 128 * 1024 or value.get('sha') != blob:
                  raise ValueError()
          except (OSError, ValueError, KeyError, TypeError):
              raise SystemExit('immutable issuer read failed') from None
          namespace = {'__name__': 'readonly_issuer_admission'}
          exec(compile(raw, 'immutable-issuer-at-I', 'exec'), namespace)
          if namespace.get('SOURCE_CONTRACT_VERSION') != 3:
              raise SystemExit('issuer does not implement reviewed main admission contract v3')
          try:
              evidence = namespace['admit_source'](source, fingerprint)
          except (ValueError, KeyError, OSError, TypeError):
              raise SystemExit('current-main source or reviewed nine-input admission failed') from None
          tool_hash = hashlib.sha256(raw).hexdigest()
          evidence.update(issuer_sha=actual, issuer_tool_sha256=tool_hash)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write(f'issuer_sha={actual}\nsource_sha={source}\nsource_inputs_sha256={fingerprint}\nissuer_tool_sha256={tool_hash}\n')
              stream.write('admission_evidence=' + json.dumps(evidence, sort_keys=True, separators=(',', ':')) + '\n')
          PY

  image:
    needs: admit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      SOURCE_SHA: ${{ needs.admit.outputs.source_sha }}
      ISSUER_SHA: ${{ needs.admit.outputs.issuer_sha }}
      SOURCE_INPUTS_SHA256: ${{ needs.admit.outputs.source_inputs_sha256 }}
      ISSUER_TOOL_SHA256: ${{ needs.admit.outputs.issuer_tool_sha256 }}
      ADMISSION_EVIDENCE: ${{ needs.admit.outputs.admission_evidence }}
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout immutable issuer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.admit.outputs.issuer_sha }}
          path: issuer
          persist-credentials: false
      - name: Admit reviewed full40 before source checkout
        run: >-
          python3 issuer/tools/ci/web_game_image.py validate-input --source-sha "$SOURCE_SHA"
          --source-inputs-sha256 "$SOURCE_INPUTS_SHA256" --issuer-tool-sha256 "$ISSUER_TOOL_SHA256"
      - name: Checkout immutable build source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.admit.outputs.source_sha }}
          path: source
          persist-credentials: false
      - name: Prepare pinned public build contract
        run: |
          test "$(git -C issuer rev-parse HEAD)" = "$ISSUER_SHA"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          proof = json.loads(os.environ['ADMISSION_EVIDENCE'])
          tool = Path('issuer/tools/ci/web_game_image.py')
          if not (hashlib.sha256(tool.read_bytes()).hexdigest() == proof['issuer_tool_sha256'] == os.environ['ISSUER_TOOL_SHA256']):
              raise SystemExit('admission proof differs from checked-out issuer or source')
          if not (proof['issuer_sha'] == os.environ['ISSUER_SHA']):
              raise SystemExit('admission proof differs from checked-out issuer or source')
          if not (proof['source_sha'] == os.environ['SOURCE_SHA']):
              raise SystemExit('admission proof differs from checked-out issuer or source')
          if not (proof['source_inputs_sha256'] == os.environ['SOURCE_INPUTS_SHA256']):
              raise SystemExit('admission proof differs from checked-out issuer or source')
          Path('admission.json').write_text(json.dumps(proof, sort_keys=True, indent=2) + '\n')
          PY
          python3 issuer/tools/ci/web_game_image.py plan \
            --source "$GITHUB_WORKSPACE/source" --source-sha "$SOURCE_SHA" \
            --issuer-sha "$ISSUER_SHA" --run-id "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" --output "$GITHUB_WORKSPACE/plan.json"
      - name: Set up pinned Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          version: v0.37.2
      - name: Authenticate candidate registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Issue and verify web-game candidate
        run: |
          python3 issuer/tools/ci/web_game_image.py issue \
            --source "$GITHUB_WORKSPACE/source" --plan "$GITHUB_WORKSPACE/plan.json" \
            --output "$GITHUB_WORKSPACE/evidence"
      - name: Upload verified issuance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-game-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            plan.json
            admission.json
            evidence/candidate.json
            evidence/build-metadata.json
          if-no-files-found: error
          retention-days: 30
