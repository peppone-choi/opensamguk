name: Build PR candidate QA images

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open same-repository PR number
        required: true
        type: string
      source_sha:
        description: Exact PR head (full lowercase SHA)
        required: true
        type: string

permissions:
  contents: read

jobs:
  images:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        surface: [gateway-api, board-api, game-api, game-engine, web-gateway, web-game]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Check candidate using trusted main helper
        id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
          CANDIDATE_METADATA: ${{ runner.temp }}/candidate-metadata.json
        run: |
          git fetch origin main
          git fetch origin "refs/pull/$PR_NUMBER/head"
          python3 tools/ci/wait_for_pr_ci.py
      - name: Checkout exact eligible source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          git checkout --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-java@v4
        if: matrix.surface == 'game-api' || matrix.surface == 'game-engine'
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        if: matrix.surface == 'game-api' || matrix.surface == 'game-engine'
        with:
          cache-read-only: true
      - name: Materialize packaged game seed through the existing path
        if: matrix.surface == 'game-api' || matrix.surface == 'game-engine'
        env:
          RTK14_STATS_JSON_B64: ${{ secrets.RTK14_STATS_JSON_B64 }}
        run: |
          bash tools/ci/build_game_jvm_images.sh enrich-internal
          ./gradlew :infra:test --no-daemon --tests 'opensamguk.infra.seed.ScenarioJsonTest.product runtime scenario declares the HWIHA new world and satisfies its seed contract'
      - name: Verify QA isolation and fixture safety
        run: python3 -m unittest discover -s tools/qa -p 'test_*.py'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: docker/${{ matrix.surface }}.Dockerfile
          push: true
          platforms: linux/amd64
          tags: ghcr.io/peppone-choi/opensamguk:${{ matrix.surface }}-qa160cand-pr${{ inputs.pr_number }}-${{ inputs.source_sha }}-${{ github.run_id }}
          labels: |
            org.opencontainers.image.revision=${{ inputs.source_sha }}
            org.opensamguk.qa.channel=pr-candidate
            org.opensamguk.qa.pr=${{ inputs.pr_number }}
            org.opensamguk.qa.base=${{ steps.gate.outputs.base_sha }}
          build-args: |
            IMAGE_TAG=${{ inputs.source_sha }}
            NEXT_PUBLIC_GATEWAY_URL=http://127.0.0.1:18300
            NEXT_PUBLIC_GAME_URL=http://127.0.0.1:18300/game/qa160
            NEXT_PUBLIC_TOPDOWN_SCREENS=1
            ASSET_PREFIX=/game
          cache-from: type=gha,scope=qa160cand-${{ matrix.surface }}
          cache-to: type=gha,mode=max,scope=qa160cand-${{ matrix.surface }}
          provenance: mode=max
      - name: Record surface digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SURFACE: ${{ matrix.surface }}
        run: |
          python3 - <<'PYCODE'
          import json, os, re
          from pathlib import Path
          digest = os.environ['DIGEST']
          assert re.fullmatch(r'sha256:[a-f0-9]{64}', digest)
          row = json.loads(Path(os.environ['RUNNER_TEMP'] + '/candidate-metadata.json').read_text())
          row['digests'] = {os.environ['SURFACE']: digest}
          Path('candidate-receipt.json').write_text(json.dumps(row))
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-receipt-${{ matrix.surface }}
          path: candidate-receipt.json
  receipt:
    needs: images
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: candidate-receipt-*
          path: receipts
      - name: Merge six matching surface receipts
        run: |
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          rows = [json.loads(p.read_text()) for p in Path('receipts').glob('*/candidate-receipt.json')]
          assert len(rows) == 6
          merged = dict(rows[0], digests={})
          for row in rows:
              assert {k:v for k,v in row.items() if k != 'digests'} == {k:v for k,v in merged.items() if k != 'digests'}
              assert not (merged['digests'].keys() & row['digests'].keys())
              merged['digests'].update(row['digests'])
          assert set(merged['digests']) == {'gateway-api','board-api','game-api','game-engine','web-gateway','web-game'}
          Path('candidate-receipt.json').write_text(json.dumps(merged))
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-receipt
          path: candidate-receipt.json
