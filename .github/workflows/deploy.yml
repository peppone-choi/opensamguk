name: Deploy exact PRIVATE pep from main

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'reports/**'
      - '.ai/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'

permissions:
  contents: read
  actions: read
  packages: write

jobs:
  pep:
    uses: ./.github/workflows/pep-loop.yml
    with:
      mode: auto
    secrets: inherit
