name: Build + Deploy to EC2

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ------------------------------------------------------------------
  # 1. Build JVM artifacts
  # ------------------------------------------------------------------
  build-jvm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build + test JVM
        run: ./gradlew build --no-daemon

      - name: Surface test results
        if: always()
        run: |
          echo "== test summary =="
          find . -path '*/build/test-results/*/*.xml' -print | head -50

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push gateway-api image
        run: |
          docker build -f docker/gateway-api.Dockerfile \
            -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:gateway-api-${{ env.IMAGE_TAG }} \
            -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:gateway-api-latest .
          docker push ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:gateway-api-${{ env.IMAGE_TAG }}
          docker push ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:gateway-api-latest

      - name: Build + push game-api image
        run: |
          docker build -f docker/game-api.Dockerfile \
            -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:game-api-${{ env.IMAGE_TAG }} \
            -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:game-api-latest .
          docker push ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:game-api-${{ env.IMAGE_TAG }}
          docker push ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:game-api-latest

      - name: Build + push game-engine image
        run: |
          docker build -f docker/game-engine.Dockerfile \
            -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:game-engine-${{ env.IMAGE_TAG }} \
            -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:game-engine-latest .
          docker push ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:game-engine-${{ env.IMAGE_TAG }}
          docker push ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:game-engine-latest

  # ------------------------------------------------------------------
  # 2. Build web images
  # ------------------------------------------------------------------
  build-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [gateway, game]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push web-${{ matrix.app }} image
        run: |
          # game은 공유 도메인 에셋 충돌 방지로 assetPrefix=/game(빌드타임). gateway는 미사용(빈 값).
          ASSET_PREFIX=""
          [ "${{ matrix.app }}" = "game" ] && ASSET_PREFIX="/game"
          docker build -f docker/web-${{ matrix.app }}.Dockerfile \
            --build-arg ASSET_PREFIX="$ASSET_PREFIX" \
            -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:web-${{ matrix.app }}-${{ env.IMAGE_TAG }} \
            -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:web-${{ matrix.app }}-latest .
          docker push ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:web-${{ matrix.app }}-${{ env.IMAGE_TAG }}
          docker push ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:web-${{ matrix.app }}-latest

  # ------------------------------------------------------------------
  # 3. Deploy to EC2
  # ------------------------------------------------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: [build-jvm, build-web]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      # 라이브 nginx 설정 정본을 박스로 동기화 — 버전관리된 infra/nginx/default.conf 가 박스
      # ~/opensamguk/docker/nginx/default.conf(compose 마운트 원본)를 덮어쓴다. 라우팅 변경은
      # 레포에서만 하면 배포 시 박스에 반영되고, 박스 재클론에도 유실되지 않는다.
      - name: Sync nginx config to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "infra/nginx/default.conf"
          target: "~/opensamguk/docker/nginx/"
          strip_components: 2

      # 빼섭(bbae) 2번째 서버 오버레이 compose를 박스로 동기화 — main 무변경, bbae 서비스 추가 +
      # gateway-frontend SERVER_REGISTRY_JSON 머지. 박스에서 -f production.yml -f bbae.yml로 적용.
      - name: Sync bbae overlay compose to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.bbae.yml"
          target: "~/opensamguk/"

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER
          script_stop: true
          script: |
            set -euo pipefail
            cd ~/opensamguk

            # Authenticate to GHCR (images are private)
            echo "=== GHCR login ==="
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # main + 빼섭 오버레이를 함께 적용(gateway-frontend가 오버레이의 SERVER_REGISTRY_JSON을 머지).
            COMPOSE="docker compose -f docker-compose.production.yml -f docker-compose.bbae.yml"

            # Pull latest images
            echo "=== Pulling images ==="
            $COMPOSE pull

            # Rolling restart — 업스트림 먼저, engine 다음, 빼섭 스택, nginx 마지막(Rule A: stale-DNS 502 방지).
            # nginx는 업스트림 컨테이너명을 시작/리로드 시 1회만 해석 → 업스트림 recreate 후 옛 IP를
            # 잡고 있으면 전 라우트 502. 반드시 모든 업스트림이 뜬 뒤 nginx를 force-recreate 한다.
            echo "=== Restarting main upstreams ==="
            $COMPOSE up -d --no-deps gateway-api game-api gateway-frontend game-frontend
            sleep 5
            $COMPOSE up -d --no-deps game-engine

            # 빼섭 2번째 스택(격리 db/redis/engine/api) — main 무중단 추가. 빈 DB면 engine이 scenario_1030 시드.
            echo "=== Starting bbae stack ==="
            $COMPOSE up -d --no-deps bbae-db bbae-redis bbae-engine bbae-api
            sleep 3
            # nginx LAST + force-recreate: scp로 동기화된 default.conf 적용 + 업스트림 IP 재해석.
            $COMPOSE up -d --force-recreate --no-deps nginx

            # Cleanup old images
            docker image prune -af --filter "until=168h"

            echo "=== Deploy complete ==="

      - name: Health check
        run: |
          set -euo pipefail
          HOST="http://${{ secrets.EC2_HOST }}"
          for i in $(seq 1 30); do
            echo "Health check attempt $i..."
            if curl -sf "${HOST}/health" >/dev/null 2>&1; then
              echo "nginx health: OK"
              break
            fi
            sleep 5
          done

          for i in $(seq 1 30); do
            echo "API health check attempt $i..."
            RESP=$(curl -sf "${HOST}/api/game/actuator/health" 2>/dev/null || echo '{"status":"DOWN"}')
            if echo "$RESP" | grep -q '"status":"UP"'; then
              echo "game-api actuator: OK"
              break
            fi
            sleep 5
          done

          for i in $(seq 1 30); do
            echo "Gateway health check attempt $i..."
            RESP=$(curl -sf "${HOST}/api/gateway/actuator/health" 2>/dev/null || echo '{"status":"DOWN"}')
            if echo "$RESP" | grep -q '"status":"UP"'; then
              echo "gateway-api actuator: OK"
              break
            fi
            sleep 5
          done

          echo "=== All health checks passed ==="
