name: Build + Deploy to EC2

on:
  push:
    branches: [main]

# 연속 머지(auto-merge 케이던스) 시 배포 런 겹침 방지 — 겹친 배포가 컨테이너를
# Created 상태로 방치해 502를 유발한 회귀(2026-06-10). 진행 중 런은 죽이지 않고
# 직렬화하되, 대기열에는 최신 1개만 남긴다(중간 커밋 배포는 건너뛰어도 최종 상태 동일).
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ------------------------------------------------------------------
  # 1. Build JVM artifacts
  # ------------------------------------------------------------------
  build-jvm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build + test JVM
        run: ./gradlew build --no-daemon

      - name: Surface test results
        if: always()
        run: |
          echo "== test summary =="
          find . -path '*/build/test-results/*/*.xml' -print | head -50

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push gateway-api image
        run: |
          docker build -f docker/gateway-api.Dockerfile \
            -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:gateway-api-${{ env.IMAGE_TAG }} \
            -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:gateway-api-latest .
          docker push ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:gateway-api-${{ env.IMAGE_TAG }}
          docker push ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:gateway-api-latest

      - name: Build + push game-api image
        run: |
          docker build -f docker/game-api.Dockerfile \
            -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:game-api-${{ env.IMAGE_TAG }} \
            -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:game-api-latest .
          docker push ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:game-api-${{ env.IMAGE_TAG }}
          docker push ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:game-api-latest

      - name: Build + push game-engine image
        run: |
          docker build -f docker/game-engine.Dockerfile \
            -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:game-engine-${{ env.IMAGE_TAG }} \
            -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:game-engine-latest .
          docker push ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:game-engine-${{ env.IMAGE_TAG }}
          docker push ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:game-engine-latest

  # ------------------------------------------------------------------
  # 2. Build web images
  # ------------------------------------------------------------------
  build-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [gateway, game]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push web-${{ matrix.app }} image
        run: |
          # game은 공유 도메인 에셋 충돌 방지로 assetPrefix=/game(빌드타임). gateway는 미사용(빈 값).
          ASSET_PREFIX=""
          [ "${{ matrix.app }}" = "game" ] && ASSET_PREFIX="/game"
          docker build -f docker/web-${{ matrix.app }}.Dockerfile \
            --build-arg ASSET_PREFIX="$ASSET_PREFIX" \
            -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:web-${{ matrix.app }}-${{ env.IMAGE_TAG }} \
            -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:web-${{ matrix.app }}-latest .
          docker push ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:web-${{ matrix.app }}-${{ env.IMAGE_TAG }}
          docker push ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:web-${{ matrix.app }}-latest

  # ------------------------------------------------------------------
  # 3. Deploy to EC2 — self-hosted runner ON the box (GH-hosted 러너 IP가 EC2 SG:22에 차단돼
  #    appleboy ssh/scp가 i/o timeout → 셀프호스티드 러너로 전환. deploy 잡이 박스에서 로컬 실행되어
  #    SSH/SCP 불필요. build-jvm/build-web은 GH-hosted 유지(GHCR 푸시만 필요).
  #
  #    2026-06-12 멀티서버 스택(~/opensamguk-docker) 전환 반영:
  #    - 게임 서버(opensamguk-s<N>)의 **game-api·game-engine은 서버별 IMAGE_TAG 고정이 정본** —
  #      진행 중 로직 점프는 RNG/로그 desync(패러티 파괴) + 둘 다 Flyway라 스키마 결합. CI 자동 갱신 금지.
  #      엔진/리드API 갱신 = 어드민 버전 패널 → deployer bounce / 시즌 경계 수동(엔진 포함).
  #    2026-06-16 사용자 결정 — **무상태 프론트(web-game)만** 매 push 자동 pull+bounce(WEB_GAME_TAG).
  #      web-game은 DB/Flyway 무관(순수 프론트) → 스키마 위험 0. game-api/engine 핀은 불변.
  #    - CI가 올리는 것: **공유 스택**(gateway-api·web-gateway·nginx) + 각 게임서버 **web-game**.
  # ------------------------------------------------------------------
  deploy:
    runs-on: [self-hosted, ec2-prod]
    needs: [build-jvm, build-web]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy shared stack on box
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          STACK="$HOME/opensamguk-docker"
          cd "$STACK"

          echo "=== GHCR login ==="   # 매 배포 재login → 박스 토큰 만료 무관.
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

          # 공유 스택 IMAGE_TAG를 이 커밋 SHA로 영속 고정(.env가 단일 진실 — 재부팅/수동 up에도 유지).
          sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${IMAGE_TAG}/" .env

          COMPOSE="docker compose -p opensamguk-shared -f docker-compose.shared.yml --env-file .env"
          echo "=== Pulling shared images ==="
          $COMPOSE pull gateway-api web-gateway

          echo "=== Restarting shared upstreams ==="
          $COMPOSE up -d --no-deps gateway-api web-gateway
          # nginx LAST + force-recreate(업스트림 IP 재해석 — Rule A: stale-DNS 502 방지)
          $COMPOSE up -d --force-recreate --no-deps nginx

          docker image prune -af --filter "until=168h"
          echo "=== Shared deploy complete — game-api/engine 고정 태그 유지(어드민 bounce로 갱신) ==="

      - name: Bounce web-game on game servers (frontend auto-pull)
        # 2026-06-16 사용자 결정: 무상태 프론트(web-game)만 매 push 자동 pull+bounce.
        # game-api/game-engine은 절대 건드리지 않는다 — 둘 다 Flyway(스키마 결합) + 엔진 RNG/로그 desync 위험.
        # 각 게임서버는 WEB_GAME_TAG(프론트 전용)만 이 커밋으로 올리고, IMAGE_TAG(api/engine 핀)는 불변.
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -uo pipefail
          STACK="$HOME/opensamguk-docker"
          cd "$STACK"
          echo "=== GHCR login (root: sudo docker가 /root/.docker 사용) ==="
          echo "$GHCR_TOKEN" | sudo docker login ghcr.io -u "$GHCR_USER" --password-stdin
          shopt -s nullglob
          for envf in servers/s*.env; do
            case "$envf" in *.bak*|*.example) continue;; esac
            sid="$(basename "$envf" .env)"          # s1, s2 ...
            # 실행 중인 게임서버만 대상(미기동 스킵 — 컨테이너명 규약 s<N>-web-game)
            if ! docker ps --format '{{.Names}}' | grep -q "^${sid}-web-game$"; then
              echo "skip ${sid}: web-game 미기동"; continue
            fi
            # web-game 전용 태그를 이 커밋으로 영속 고정(.env 단일 진실, 재부팅/수동 up에도 유지).
            if sudo grep -qE '^WEB_GAME_TAG=' "$envf"; then
              sudo sed -i "s/^WEB_GAME_TAG=.*/WEB_GAME_TAG=${IMAGE_TAG}/" "$envf"
            else
              echo "WEB_GAME_TAG=${IMAGE_TAG}" | sudo tee -a "$envf" >/dev/null
            fi
            DC="sudo docker compose -p opensamguk-${sid} -f docker-compose.server.yml --env-file ${envf}"
            echo "=== ${sid}: web-game pull + bounce @ ${IMAGE_TAG} (api/engine 핀 유지) ==="
            $DC pull web-game
            $DC up -d --no-deps web-game
          done
          echo "=== web-game 프론트 자동 pull 완료 (game-api/engine 불변) ==="

      - name: Verify (health + s1 turn-advance)
        run: |
          set -uo pipefail
          # Rule A — nginx/gateway health (localhost, 박스 내부).
          for i in $(seq 1 30); do
            curl -sf "http://localhost/health" >/dev/null 2>&1 && { echo "nginx health: OK"; break; }
            sleep 5
          done
          for i in $(seq 1 30); do
            RESP=$(curl -sf "http://localhost/api/health" 2>/dev/null || echo DOWN)
            echo "$RESP" | grep -q '"status":"UP"' && { echo "web-gateway health: OK"; break; }
            sleep 5
          done
          # Rule B — s1 world_state clock 전진(이 잡은 게임 서버를 안 건드리지만 부수 피해 감지용).
          # 비차단 WARN(턴 주기상 75s 내 미전진은 정상일 수 있음).
          C1=$(docker exec s1-game-postgres psql -U sammo -d sammo -tAc 'select current_year*100+current_month from world_state;' 2>/dev/null | tr -d ' ')
          sleep 75
          C2=$(docker exec s1-game-postgres psql -U sammo -d sammo -tAc 'select current_year*100+current_month from world_state;' 2>/dev/null | tr -d ' ')
          echo "s1 world clock: $C1 -> $C2"
          if [ -n "$C1" ] && [ "$C1" != "$C2" ]; then echo "turn-advance: OK"; else echo "INFO: clock unchanged in 75s ($C1 -> $C2) — 턴 주기상 정상 가능, 동결 의심 시 엔진 로그 확인"; fi
          echo "=== Verify done ==="
