name: Build + Deploy to GCP VM

on:
  push:
    branches: [main]

# 연속 머지(auto-merge 케이던스) 시 배포 런 겹침 방지 — 겹친 배포가 컨테이너를
# Created 상태로 방치해 502를 유발한 회귀(2026-06-10). 진행 중 런은 죽이지 않고
# 직렬화하되, 대기열에는 최신 1개만 남긴다(중간 커밋 배포는 건너뛰어도 최종 상태 동일).
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ------------------------------------------------------------------
  # 1. Build JVM artifacts
  # ------------------------------------------------------------------
  build-jvm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build + test JVM
        run: ./gradlew build --no-daemon

      - name: Surface test results
        if: always()
        run: |
          echo "== test summary =="
          find . -path '*/build/test-results/*/*.xml' -print | head -50

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push gateway-api image
        run: |
          docker build -f docker/gateway-api.Dockerfile \
            --build-arg IMAGE_TAG="${{ env.IMAGE_TAG }}" \
            -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:gateway-api-${{ env.IMAGE_TAG }} \
            -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:gateway-api-latest .
          docker push ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:gateway-api-${{ env.IMAGE_TAG }}
          docker push ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:gateway-api-latest

      - name: Build + push game-api image
        run: |
          docker build -f docker/game-api.Dockerfile \
            --build-arg IMAGE_TAG="${{ env.IMAGE_TAG }}" \
            -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:game-api-${{ env.IMAGE_TAG }} \
            -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:game-api-latest .
          docker push ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:game-api-${{ env.IMAGE_TAG }}
          docker push ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:game-api-latest

      - name: Build + push game-engine image
        run: |
          docker build -f docker/game-engine.Dockerfile \
            --build-arg IMAGE_TAG="${{ env.IMAGE_TAG }}" \
            -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:game-engine-${{ env.IMAGE_TAG }} \
            -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:game-engine-latest .
          docker push ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:game-engine-${{ env.IMAGE_TAG }}
          docker push ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:game-engine-latest

  # ------------------------------------------------------------------
  # 2. Build web images
  # ------------------------------------------------------------------
  build-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [gateway, game]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push web-${{ matrix.app }} image
        run: |
          # game은 공유 도메인 에셋 충돌 방지로 assetPrefix=/game(빌드타임). gateway는 미사용(빈 값).
          ASSET_PREFIX=""
          [ "${{ matrix.app }}" = "game" ] && ASSET_PREFIX="/game"
          docker build -f docker/web-${{ matrix.app }}.Dockerfile \
            --build-arg ASSET_PREFIX="$ASSET_PREFIX" \
            -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:web-${{ matrix.app }}-${{ env.IMAGE_TAG }} \
            -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:web-${{ matrix.app }}-latest .
          docker push ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:web-${{ matrix.app }}-${{ env.IMAGE_TAG }}
          docker push ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:web-${{ matrix.app }}-latest

  # ------------------------------------------------------------------
  # 3. Deploy to GCP VM — self-hosted runner ON the VM (deploy job runs locally, so
  #    SSH/SCP is unnecessary. build-jvm/build-web remain GH-hosted; only GHCR push is needed).
  # ------------------------------------------------------------------
  deploy:
    runs-on: [self-hosted, gcp-prod]
    needs: [build-jvm, build-web]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Deploy shared stack on box
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          exec 9>/tmp/opensamguk-production.lock
          if ! flock -w 1800 9; then
            echo "ERROR: timed out after 1800 seconds waiting for /tmp/opensamguk-production.lock" >&2
            exit 1
          fi
          STACK="$HOME/opensamguk-docker"
          cd "$STACK"

          echo "=== Syncing opensamguk-docker main ==="
          if [ -n "$(git status --porcelain --untracked-files=normal)" ]; then
            echo "ERROR: refusing to sync a dirty tracked or non-ignored untracked opensamguk-docker tree; ignored runtime env files are untouched" >&2
            git status --short --untracked-files=normal >&2
            exit 1
          fi
          git fetch origin main
          git merge --ff-only origin/main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "ERROR: opensamguk-docker HEAD does not match origin/main after fast-forward sync" >&2
            exit 1
          fi

          echo "=== GHCR login ==="   # 매 배포 재login → 박스 토큰 만료 무관.
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

          COMPOSE="docker compose -p opensamguk-shared -f docker-compose.shared.yml --env-file .env"

          echo "=== Updating deployer from opensamguk-docker ==="
          $COMPOSE up -d --build --force-recreate --no-deps deployer

          echo "=== Verifying deployer compatibility ==="
          DEPLOYER_TOKEN="$(grep '^DEPLOYER_TOKEN=' .env | cut -d= -f2-)"
          docker exec -e DEPLOYER_TOKEN="$DEPLOYER_TOKEN" opensamguk-deployer \
            sh -c 'wget -qO- --header="Authorization: Bearer $DEPLOYER_TOKEN" "http://localhost:9000/env/shared"' \
            | grep -q '"ok":true'
          readonly RESERVED_PUBLIC_SERVER_IDS='all admin1 admin2 admin5 admin7 admin8 auction battle-center betting board chief-center city coming-soon diplomacy generals global-diplomacy history inherit join mailbox main map my my-boss my-cities my-generals my-nation nation nation-betting nation-finance npc-control rankings register select-pool simulator tournament tournament-admin troop vote world-log'

          is_reserved_public_server_id() {
            local server_id="$1"
            [[ " $RESERVED_PUBLIC_SERVER_IDS " == *" $server_id "* ]]
          }

          shopt -s nullglob
          for envf in servers/s*.env; do
            case "$envf" in *.bak*|*.example) continue;; esac
            internal_server="$(basename "$envf" .env)"
            public_server="${internal_server#s}"
            if [[ "$internal_server" != "s${public_server}" || ! "$public_server" =~ ^[a-z0-9]+$ ]]; then
              echo "Invalid or reserved game server env file: $envf" >&2
              exit 1
            fi
            if is_reserved_public_server_id "$public_server"; then
              echo "Invalid or reserved game server env file: $envf" >&2
              exit 1
            fi
            docker exec -e DEPLOYER_TOKEN="$DEPLOYER_TOKEN" opensamguk-deployer \
              sh -c "wget -qO- --header=\"Authorization: Bearer \$DEPLOYER_TOKEN\" \"http://localhost:9000/env/server?id=${public_server}\"" \
              | grep -q '"ok":true'
          done

          # 공유 스택 IMAGE_TAG를 이 커밋 SHA로 영속 고정(.env가 단일 진실 — 재부팅/수동 up에도 유지).
          sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${IMAGE_TAG}/" .env

          SHARED_SERVICES="gateway-api web-gateway"
          if $COMPOSE config --services | grep -qx 'game-frontend'; then
            SHARED_SERVICES="$SHARED_SERVICES game-frontend"
          fi

          echo "=== Ensuring shared dependencies ==="
          $COMPOSE up -d gateway-postgres gateway-redis

          echo "=== Pulling shared images ==="
          $COMPOSE pull $SHARED_SERVICES

          echo "=== Restarting shared upstreams ==="
          $COMPOSE up -d --force-recreate --no-deps $SHARED_SERVICES
          # nginx LAST + force-recreate(업스트림 IP 재해석 — Rule A: stale-DNS 502 방지)
          $COMPOSE up -d --force-recreate --no-deps nginx

          docker image prune -af --filter "until=168h"
          echo "=== Shared deploy complete; game server pins are unchanged ==="

      - name: Preserve game server version pins
        run: |
          set -euo pipefail
          STACK="$HOME/opensamguk-docker"
          cd "$STACK"
          shopt -s nullglob
          found=0
          for envf in servers/s*.env; do
            case "$envf" in *.bak*|*.example) continue;; esac
            found=$((found + 1))
            sid="$(basename "$envf" .env)"
            current="$(sudo grep -E '^IMAGE_TAG=' "$envf" | cut -d= -f2- || true)"
            web="$(sudo grep -E '^WEB_GAME_TAG=' "$envf" | cut -d= -f2- || true)"
            echo "${sid}: IMAGE_TAG=${current:-unset} WEB_GAME_TAG=${web:-unset}"
          done
          if [ "$found" -eq 0 ]; then
            echo "no game servers registered yet; shared stack only"
          else
            echo "game server pins preserved; promote explicitly outside this workflow"
          fi

      - name: Verify (health + registered game servers)
        run: |
          set -euo pipefail
          dump_shared_diagnostics() {
            status=$?
            echo "=== Shared diagnostics (status=$status) ==="
            docker ps -a --filter 'name=opensamguk-' --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}' || true
            for c in opensamguk-gateway-api opensamguk-web-gateway opensamguk-nginx opensamguk-gateway-postgres opensamguk-gateway-redis; do
              echo "=== docker logs --tail 160 $c ==="
              docker logs --tail 160 "$c" || true
            done
            exit "$status"
          }
          trap dump_shared_diagnostics ERR
          # Rule A — nginx/gateway health (localhost, 박스 내부).
          for i in $(seq 1 30); do
            if curl -sf "http://localhost/health" >/dev/null 2>&1; then
              echo "nginx health: OK"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "nginx health: FAILED"
              false
            fi
            sleep 5
          done
          for i in $(seq 1 30); do
            RESP=$(curl -sf "http://localhost/api/gateway/actuator/health" 2>/dev/null || echo DOWN)
            if echo "$RESP" | grep -q '"status":"UP"'; then
              echo "gateway-api health: OK"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "gateway-api health: FAILED — $RESP"
              false
            fi
            sleep 5
          done
          for i in $(seq 1 30); do
            RESP=$(curl -sf "http://localhost/api/health" 2>/dev/null || echo DOWN)
            if echo "$RESP" | grep -q '"status":"UP"'; then
              echo "web-gateway health: OK"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "web-gateway health: FAILED — $RESP"
              false
            fi
            sleep 5
          done
          STACK="$HOME/opensamguk-docker"
          cd "$STACK"
          shopt -s nullglob
          readonly RESERVED_PUBLIC_SERVER_IDS='all admin1 admin2 admin5 admin7 admin8 auction battle-center betting board chief-center city coming-soon diplomacy generals global-diplomacy history inherit join mailbox main map my my-boss my-cities my-generals my-nation nation nation-betting nation-finance npc-control rankings register select-pool simulator tournament tournament-admin troop vote world-log'

          is_reserved_public_server_id() {
            local server_id="$1"
            [[ " $RESERVED_PUBLIC_SERVER_IDS " == *" $server_id "* ]]
          }

          declare -a RUNNING_INTERNAL_SERVERS=()
          registered_servers=0
          for envf in servers/s*.env; do
            internal_server="$(basename "$envf" .env)"
            public_server="${internal_server#s}"
            if [[ "$internal_server" != "s${public_server}" || ! "$public_server" =~ ^[a-z0-9]+$ ]]; then
              echo "Invalid or reserved game server env file: $envf" >&2
              false
            fi
            if is_reserved_public_server_id "$public_server"; then
              echo "Invalid or reserved game server env file: $envf" >&2
              false
            fi
            registered_servers=$((registered_servers + 1))

            api_container="${internal_server}-game-api"
            engine_container="${internal_server}-game-engine"
            web_container="${internal_server}-web-game"
            known_containers=0
            running_containers=0
            for container in "$api_container" "$engine_container" "$web_container"; do
              if docker ps -a --format '{{.Names}}' | grep -qx "$container"; then
                known_containers=$((known_containers + 1))
              fi
              if docker ps --format '{{.Names}}' | grep -qx "$container"; then
                running_containers=$((running_containers + 1))
              fi
            done
            if [[ "$running_containers" -eq 0 ]]; then
              if [[ "$known_containers" -eq 0 ]]; then
                echo "${public_server} (${internal_server}) not running; game-server verification skipped"
                continue
              fi
              echo "${public_server} (${internal_server}) has stopped game containers" >&2
              false
            fi
            if [[ "$known_containers" -ne 3 || "$running_containers" -ne 3 ]]; then
              echo "${public_server} (${internal_server}) has incomplete game containers" >&2
              false
            fi

            docker exec "$api_container" wget -qO- http://localhost:8081/actuator/health | grep -q '"status":"UP"'
            docker exec "$engine_container" wget -qO- http://localhost:8082/actuator/health | grep -q '"status":"UP"'
            curl -fsSI "http://localhost/game/${public_server}" >/dev/null
            echo "${public_server} (${internal_server}) API, engine, web route: OK"
            RUNNING_INTERNAL_SERVERS+=("$internal_server")
          done

          if [[ "$registered_servers" -eq 0 ]]; then
            echo "no game servers registered yet; game-server verification skipped"
          elif [[ "${#RUNNING_INTERNAL_SERVERS[@]}" -eq 0 ]]; then
            echo "no registered game servers running; game-server verification skipped"
          else
            declare -A CLOCK_BEFORE=()
            for internal_server in "${RUNNING_INTERNAL_SERVERS[@]}"; do
              CLOCK_BEFORE["$internal_server"]="$(docker exec "${internal_server}-game-postgres" psql -U sammo -d sammo -tAc 'select current_year*100+current_month from world_state;' 2>/dev/null | tr -d ' ')"
            done
            sleep 75
            for internal_server in "${RUNNING_INTERNAL_SERVERS[@]}"; do
              public_server="${internal_server#s}"
              clock_after="$(docker exec "${internal_server}-game-postgres" psql -U sammo -d sammo -tAc 'select current_year*100+current_month from world_state;' 2>/dev/null | tr -d ' ')"
              clock_before="${CLOCK_BEFORE[$internal_server]}"
              echo "${public_server} world clock: $clock_before -> $clock_after"
              if [[ -n "$clock_before" && "$clock_before" != "$clock_after" ]]; then
                echo "${public_server} turn-advance: OK"
              else
                echo "INFO: ${public_server} clock unchanged in 75s ($clock_before -> $clock_after) — 턴 주기상 정상 가능, 동결 의심 시 엔진 로그 확인"
              fi
            done
          fi
          echo "=== Verify done ==="
