name: Build + Deploy to GCP VM

on:
  push:
    branches: [main]

# 연속 머지(auto-merge 케이던스) 시 배포 런 겹침 방지 — 겹친 배포가 컨테이너를
# Created 상태로 방치해 502를 유발한 회귀(2026-06-10). 진행 중 런은 죽이지 않고
# 직렬화하되, 대기열에는 최신 1개만 남긴다(중간 커밋 배포는 건너뛰어도 최종 상태 동일).
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ------------------------------------------------------------------
  # 1. Build JVM artifacts
  # ------------------------------------------------------------------
  build-jvm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build + test JVM
        run: ./gradlew build --no-daemon

      - name: Surface test results
        if: always()
        run: |
          echo "== test summary =="
          find . -path '*/build/test-results/*/*.xml' -print | head -50

      - name: Materialize RTK14 scenario stats for image build
        shell: bash
        env:
          RTK14_STATS_JSON_B64: ${{ secrets.RTK14_STATS_JSON_B64 }}
        run: |
          set -euo pipefail
          umask 077

          readonly SCENARIO_DIR="$GITHUB_WORKSPACE/infra/src/main/resources/scenario"
          source_json="$(mktemp)"
          diagnostics="$(mktemp)"
          staging_dir="$(mktemp -d)"
          cleanup() {
            rm -f -- "$source_json" "$diagnostics"
            rm -rf -- "$staging_dir"
          }
          trap cleanup EXIT
          trap 'exit 1' HUP INT TERM

          if [[ -z "${RTK14_STATS_JSON_B64:-}" ]]; then
            echo "ERROR: RTK14_STATS_JSON_B64 is required for main production image builds." >&2
            exit 1
          fi

          shopt -s nullglob
          candidate_scenario_files=("$SCENARIO_DIR"/scenario_*.json)
          scenario_files=()
          for candidate in "${candidate_scenario_files[@]}"; do
            scenario_schema="$(
              python3 - "$candidate" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              scenario = json.load(handle)
          if not isinstance(scenario, dict):
              raise ValueError("scenario JSON root must be an object")

          runtime_sections = ("general", "general_ex", "general_neutral")
          archive_sections = ("generals", "generalsEx")
          if not any(section in scenario for section in runtime_sections) and any(section in scenario for section in archive_sections):
              print("normalized_archive")
          else:
              print("runtime_or_settings")
          PY
            )"
            case "$scenario_schema" in
              normalized_archive)
                ;;
              runtime_or_settings)
                scenario_files+=("$candidate")
                ;;
              *)
                echo "ERROR: unable to classify a scenario JSON file for RTK14 enrichment." >&2
                exit 1
                ;;
            esac
          done
          scenario_count="${#scenario_files[@]}"
          if (( scenario_count == 0 )); then
            echo "ERROR: no runtime scenario JSON files were found for RTK14 enrichment." >&2
            exit 1
          fi

          if ! (printf '%s' "$RTK14_STATS_JSON_B64" | base64 -d | gzip -dc) > "$source_json" 2>"$diagnostics"; then
            echo "ERROR: RTK14_STATS_JSON_B64 could not be decoded." >&2
            exit 1
          fi

          if ! python3 tools/rtk14/build_rtk14_stats.py \
            --rtk-source-json "$source_json" \
            --scenario-dir "$SCENARIO_DIR" \
            --out-dir "$staging_dir" \
            > "$diagnostics" 2>&1; then
            echo "ERROR: RTK14 scenario enrichment failed." >&2
            exit 1
          fi

          staged_files=("$staging_dir"/scenario_*.json)
          if (( ${#staged_files[@]} != scenario_count )); then
            echo "ERROR: RTK14 scenario enrichment did not produce every runtime scenario file." >&2
            exit 1
          fi
          for scenario_file in "${scenario_files[@]}"; do
            staged_file="$staging_dir/$(basename "$scenario_file")"
            if [[ ! -f "$staged_file" ]]; then
              echo "ERROR: RTK14 scenario enrichment missed a runtime scenario file." >&2
              exit 1
            fi
            cp "$staged_file" "$scenario_file"
          done

          echo "RTK14 scenario enrichment completed for ${scenario_count} scenario file(s)."

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push gateway-api image
        run: |
          docker build -f docker/gateway-api.Dockerfile \
            --build-arg IMAGE_TAG="${{ env.IMAGE_TAG }}" \
            -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:gateway-api-${{ env.IMAGE_TAG }} \
            -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:gateway-api-latest .
          docker push ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:gateway-api-${{ env.IMAGE_TAG }}
          docker push ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:gateway-api-latest

      - name: Build + push board-api image
        run: |
          docker build -f docker/board-api.Dockerfile \
            --build-arg IMAGE_TAG="${{ env.IMAGE_TAG }}" \
            -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:board-api-${{ env.IMAGE_TAG }} \
            -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:board-api-latest .
          docker push ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:board-api-${{ env.IMAGE_TAG }}
          docker push ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:board-api-latest

      - name: Build + push game-api image
        run: |
          docker build -f docker/game-api.Dockerfile \
            --build-arg IMAGE_TAG="${{ env.IMAGE_TAG }}" \
            -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:game-api-${{ env.IMAGE_TAG }} \
            -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:game-api-latest .
          docker push ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:game-api-${{ env.IMAGE_TAG }}
          docker push ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:game-api-latest

      - name: Build + push game-engine image
        run: |
          docker build -f docker/game-engine.Dockerfile \
            --build-arg IMAGE_TAG="${{ env.IMAGE_TAG }}" \
            -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:game-engine-${{ env.IMAGE_TAG }} \
            -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:game-engine-latest .
          docker push ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:game-engine-${{ env.IMAGE_TAG }}
          docker push ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:game-engine-latest

  # ------------------------------------------------------------------
  # 2. Build web images
  # ------------------------------------------------------------------
  build-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [gateway, game]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push web-${{ matrix.app }} image
        run: |
          # game은 공유 도메인 에셋 충돌 방지로 assetPrefix=/game(빌드타임). gateway는 미사용(빈 값).
          ASSET_PREFIX=""
          [ "${{ matrix.app }}" = "game" ] && ASSET_PREFIX="/game"
          docker build -f docker/web-${{ matrix.app }}.Dockerfile \
            --build-arg ASSET_PREFIX="$ASSET_PREFIX" \
            -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:web-${{ matrix.app }}-${{ env.IMAGE_TAG }} \
            -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:web-${{ matrix.app }}-latest .
          docker push ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:web-${{ matrix.app }}-${{ env.IMAGE_TAG }}
          docker push ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:web-${{ matrix.app }}-latest

  # ------------------------------------------------------------------
  # 3. Deploy to GCP VM — self-hosted runner ON the VM (deploy job runs locally, so
  #    SSH/SCP is unnecessary. build-jvm/build-web remain GH-hosted; only GHCR push is needed).
  # ------------------------------------------------------------------
  deploy:
    runs-on: [self-hosted, gcp-prod]
    needs: [build-jvm, build-web]
    permissions:
      contents: read
      packages: read
    steps:
      # actions/checkout 없음(의도) — 이 job은 워크스페이스를 한 번도 읽지 않고 전부
      # $HOME/opensamguk-docker(=$STACK) 안에서 돈다. self-hosted 러너는 매 실행마다
      # codeload.github.com에서 액션 tarball을 새로 받는데, 그 IP가 429(Too Many Requests)에
      # 걸리면 쓰지도 않는 체크아웃 때문에 배포 전체가 죽는다(run 32035675655·32037387818·32038640965).
      - name: Deploy shared stack on box
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          exec 9>/tmp/opensamguk-production.lock
          if ! flock -w 1800 9; then
            echo "ERROR: timed out after 1800 seconds waiting for /tmp/opensamguk-production.lock" >&2
            exit 1
          fi
          STACK="$HOME/opensamguk-docker"
          cd "$STACK"

          echo "=== Syncing opensamguk-docker main ==="
          if [ -n "$(git status --porcelain --untracked-files=normal)" ]; then
            echo "ERROR: refusing to sync a dirty tracked or non-ignored untracked opensamguk-docker tree; ignored runtime env files are untouched" >&2
            git status --short --untracked-files=normal >&2
            exit 1
          fi
          git fetch origin main
          git merge --ff-only origin/main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "ERROR: opensamguk-docker HEAD does not match origin/main after fast-forward sync" >&2
            exit 1
          fi

          echo "=== GHCR login ==="   # 매 배포 재login → 박스 토큰 만료 무관.
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

          COMPOSE="docker compose -p opensamguk-shared -f docker-compose.shared.yml --env-file .env"

          # deployer는 docker.sock에 직접 붙지 않고 socket-proxy 경유로만 Docker에 접근한다
          # (docker-compose.shared.yml: DOCKER_HOST=tcp://socket-proxy:2375 + depends_on).
          # 아래 deployer 재생성은 --no-deps라 의존 서비스를 띄우지 않으므로 여기서 명시적으로
          # 보장한다. 누락되면 deployer의 모든 docker compose 호출이 exit 1로 죽고, 서버
          # 리셋이 down 단계에서 실패해 repair-required로 잠긴다(2026-08-04 장애).
          echo "=== Ensuring deployer socket-proxy ==="
          $COMPOSE up -d socket-proxy

          echo "=== Updating deployer from opensamguk-docker ==="
          $COMPOSE up -d --build --force-recreate --no-deps deployer

          echo "=== Verifying deployer compatibility ==="
          docker exec opensamguk-deployer \
            sh -c 'wget -qO- --header="Authorization: Bearer $DEPLOYER_TOKEN" "http://localhost:9000/env/shared"' \
            | grep -q '"ok":true'

          # 컨테이너 존재가 아니라 deployer -> socket-proxy -> Docker 도달성을 검증한다
          # (socket-proxy에는 healthcheck가 없어 up -d는 crash-loop을 그대로 통과시킨다).
          if ! docker exec opensamguk-deployer docker version >/dev/null; then
            echo "ERROR: deployer cannot reach Docker through socket-proxy" >&2
            exit 1
          fi

          readonly PUBLIC_SERVER_ID_PATTERN='^[a-z0-9]{1,48}$'
          readonly RESERVED_PUBLIC_SERVER_IDS='all admin1 admin2 admin5 admin7 admin8 auction battle-center betting board chief-center city coming-soon diplomacy generals global-diplomacy history inherit join mailbox main map my my-boss my-cities my-generals my-nation nation nation-betting nation-finance npc-control rankings register select-pool simulator tournament tournament-admin troop vote world-log'

          is_reserved_public_server_id() {
            local server_id="$1"
            [[ " $RESERVED_PUBLIC_SERVER_IDS " == *" $server_id "* ]]
          }

          shopt -s nullglob
          for envf in servers/s*.env; do
            case "$envf" in *.bak*|*.example) continue;; esac
            internal_server="$(basename "$envf" .env)"
            public_server="${internal_server#s}"
            if [[ "$internal_server" != "s${public_server}" || ! "$public_server" =~ $PUBLIC_SERVER_ID_PATTERN ]]; then
              echo "Invalid or reserved game server env file: $envf" >&2
              exit 1
            fi
            if is_reserved_public_server_id "$public_server"; then
              echo "Invalid or reserved game server env file: $envf" >&2
              exit 1
            fi
            docker exec opensamguk-deployer \
              sh -c 'wget -qO- --header="Authorization: Bearer $DEPLOYER_TOKEN" "http://localhost:9000/env/server?id=$1"' sh "$public_server" \
              | grep -q '"ok":true'
          done

          if ! $COMPOSE config --services | grep -qx 'board-api'; then
            echo "BLOCKED: opensamguk-docker must define board-api before gateway/web activation" >&2
            exit 1
          fi
          if ! $COMPOSE config | grep -q 'BOARD_API_URL:'; then
            echo "BLOCKED: opensamguk-docker web-gateway must define BOARD_API_URL before gateway/web activation" >&2
            exit 1
          fi

          docker exec opensamguk-deployer \
            /usr/local/bin/deployer --check-running-registry-targets

          # 공유 스택 IMAGE_TAG를 이 커밋 SHA로 영속 고정(.env가 단일 진실 — 재부팅/수동 up에도 유지).
          sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${IMAGE_TAG}/" .env

          SHARED_SERVICES="gateway-api board-api web-gateway"
          if $COMPOSE config --services | grep -qx 'game-frontend'; then
            SHARED_SERVICES="$SHARED_SERVICES game-frontend"
          fi

          echo "=== Ensuring shared dependencies ==="
          $COMPOSE up -d gateway-postgres gateway-redis

          echo "=== Pulling shared images ==="
          $COMPOSE pull $SHARED_SERVICES

          wait_container_health() {
            local container="$1"
            local port="$2"
            local label="$3"
            for i in $(seq 1 30); do
              if docker exec "$container" curl -sf "http://localhost:${port}/actuator/health" >/dev/null 2>&1; then
                echo "${label} readiness: OK"
                return 0
              fi
              if [ "$i" -eq 30 ]; then
                echo "${label} readiness: FAILED" >&2
                return 1
              fi
              sleep 5
            done
          }

          echo "=== Restarting board API ==="
          $COMPOSE up -d --force-recreate --no-deps board-api
          wait_container_health opensamguk-board-api 8083 board-api

          jwt_signing_mode="$(sed -n 's/^JWT_SIGNING_MODE=//p' .env | tail -1 | tr -d "\r[:space:]\"'" | tr '[:lower:]' '[:upper:]')"
          include_profile_claims="$(sed -n 's/^JWT_INCLUDE_PROFILE_CLAIMS=//p' .env | tail -1 | tr -d "\r[:space:]\"'" | tr '[:upper:]' '[:lower:]')"
          jwt_signing_mode="${jwt_signing_mode:-RS256}"
          include_profile_claims="${include_profile_claims:-true}"
          if [[ "$jwt_signing_mode" == "RS256" || "$include_profile_claims" == "false" ]]; then
            jwt_public_key="$(sed -n 's/^JWT_PUBLIC_KEY=//p' .env | tail -1 | tr -d "\r[:space:]\"'")"
            if [[ -z "$jwt_public_key" ]]; then
              echo "BLOCKED: JWT_PUBLIC_KEY is required for asymmetric gateway cutover" >&2
              exit 1
            fi
            expected_jwt_public_key_sha256="$(printf '%s' "$jwt_public_key" | base64 -d | sha256sum | awk '{print $1}')"
            unset jwt_public_key
            board_info="$(docker exec opensamguk-board-api curl -sf http://localhost:8083/actuator/info)"
            if ! grep -q '"verifier":"rsa-audience-v1"' <<<"$board_info"; then
              echo "BLOCKED: board-api has not advertised the asymmetric JWT verifier" >&2
              exit 1
            fi
            if ! grep -Fq "\"publicKeySha256\":\"${expected_jwt_public_key_sha256}\"" <<<"$board_info"; then
              echo "BLOCKED: board-api is not using the configured JWT public key" >&2
              exit 1
            fi
            for envf in servers/s*.env; do
              case "$envf" in *.bak*|*.example) continue;; esac
              internal_server="$(basename "$envf" .env)"
              api_container="${internal_server}-game-api"
              if ! docker ps --format '{{.Names}}' | grep -qx "$api_container"; then
                echo "BLOCKED: ${internal_server} must be running and promoted before gateway cutover" >&2
                exit 1
              fi
              api_info="$(docker exec "$api_container" wget -qO- http://localhost:8081/actuator/info)"
              if ! grep -q '"verifier":"rsa-audience-v1"' <<<"$api_info"; then
                echo "BLOCKED: ${internal_server} must be promoted to the asymmetric JWT verifier before gateway cutover" >&2
                exit 1
              fi
              if ! grep -Fq "\"publicKeySha256\":\"${expected_jwt_public_key_sha256}\"" <<<"$api_info"; then
                echo "BLOCKED: ${internal_server} is not using the configured JWT public key" >&2
                exit 1
              fi
            done
            unset expected_jwt_public_key_sha256
          fi

          echo "=== Restarting gateway migrations ==="
          $COMPOSE up -d --force-recreate --no-deps gateway-api
          wait_container_health opensamguk-gateway-api 8080 gateway-api

          echo "=== Restarting shared web ==="
          $COMPOSE up -d --force-recreate --no-deps web-gateway
          if $COMPOSE config --services | grep -qx 'game-frontend'; then
            $COMPOSE up -d --force-recreate --no-deps game-frontend
          fi
          # nginx LAST + force-recreate(업스트림 IP 재해석 — Rule A: stale-DNS 502 방지)
          $COMPOSE up -d --force-recreate --no-deps nginx

          docker image prune -af --filter "until=168h"
          echo "=== Shared deploy complete; game server pins are unchanged ==="

      - name: Preserve game server version pins
        run: |
          set -euo pipefail
          STACK="$HOME/opensamguk-docker"
          cd "$STACK"
          shopt -s nullglob
          readonly PUBLIC_SERVER_ID_PATTERN='^[a-z0-9]{1,48}$'
          readonly RESERVED_PUBLIC_SERVER_IDS='all admin1 admin2 admin5 admin7 admin8 auction battle-center betting board chief-center city coming-soon diplomacy generals global-diplomacy history inherit join mailbox main map my my-boss my-cities my-generals my-nation nation nation-betting nation-finance npc-control rankings register select-pool simulator tournament tournament-admin troop vote world-log'

          is_reserved_public_server_id() {
            local server_id="$1"
            [[ " $RESERVED_PUBLIC_SERVER_IDS " == *" $server_id "* ]]
          }

          found=0
          for envf in servers/s*.env; do
            case "$envf" in *.bak*|*.example) continue;; esac
            sid="$(basename "$envf" .env)"
            public_server="${sid#s}"
            if [[ "$sid" != "s${public_server}" || ! "$public_server" =~ $PUBLIC_SERVER_ID_PATTERN ]]; then
              echo "Invalid or reserved game server env file: $envf" >&2
              exit 1
            fi
            if is_reserved_public_server_id "$public_server"; then
              echo "Invalid or reserved game server env file: $envf" >&2
              exit 1
            fi
            found=$((found + 1))
            current="$(sudo grep -E '^IMAGE_TAG=' "$envf" | cut -d= -f2- || true)"
            web="$(sudo grep -E '^WEB_GAME_TAG=' "$envf" | cut -d= -f2- || true)"
            echo "${sid}: IMAGE_TAG=${current:-unset} WEB_GAME_TAG=${web:-unset}"
          done
          if [ "$found" -eq 0 ]; then
            echo "no game servers registered yet; shared stack only"
          else
            echo "game server pins preserved; promote explicitly outside this workflow"
          fi

      - name: Verify (health + registered game servers)
        run: |
          set -euo pipefail
          dump_shared_diagnostics() {
            status=$?
            echo "=== Shared diagnostics (status=$status) ==="
            docker ps -a --filter 'name=opensamguk-' --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}' || true
            for c in opensamguk-gateway-api opensamguk-board-api opensamguk-web-gateway opensamguk-nginx opensamguk-gateway-postgres opensamguk-gateway-redis; do
              echo "=== docker logs --tail 160 $c ==="
              docker logs --tail 160 "$c" || true
            done
            exit "$status"
          }
          trap dump_shared_diagnostics ERR
          # Rule A — nginx/gateway health (localhost, 박스 내부).
          for i in $(seq 1 30); do
            if curl -sf "http://localhost/health" >/dev/null 2>&1; then
              echo "nginx health: OK"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "nginx health: FAILED"
              false
            fi
            sleep 5
          done
          for i in $(seq 1 30); do
            RESP=$(curl -sf "http://localhost/api/gateway/actuator/health" 2>/dev/null || echo DOWN)
            if echo "$RESP" | grep -q '"status":"UP"'; then
              echo "gateway-api health: OK"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "gateway-api health: FAILED — $RESP"
              false
            fi
            sleep 5
          done
          for i in $(seq 1 30); do
            RESP=$(docker exec opensamguk-board-api curl -sf http://localhost:8083/actuator/health 2>/dev/null || echo DOWN)
            if echo "$RESP" | grep -q '"status":"UP"'; then
              echo "board-api health: OK"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "board-api health: FAILED — $RESP"
              false
            fi
            sleep 5
          done
          for i in $(seq 1 30); do
            RESP=$(curl -sf "http://localhost/api/health" 2>/dev/null || echo DOWN)
            if echo "$RESP" | grep -q '"status":"UP"'; then
              echo "web-gateway health: OK"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "web-gateway health: FAILED — $RESP"
              false
            fi
            sleep 5
          done
          STACK="$HOME/opensamguk-docker"
          cd "$STACK"
          shopt -s nullglob
          readonly PUBLIC_SERVER_ID_PATTERN='^[a-z0-9]{1,48}$'
          readonly RESERVED_PUBLIC_SERVER_IDS='all admin1 admin2 admin5 admin7 admin8 auction battle-center betting board chief-center city coming-soon diplomacy generals global-diplomacy history inherit join mailbox main map my my-boss my-cities my-generals my-nation nation nation-betting nation-finance npc-control rankings register select-pool simulator tournament tournament-admin troop vote world-log'

          is_reserved_public_server_id() {
            local server_id="$1"
            [[ " $RESERVED_PUBLIC_SERVER_IDS " == *" $server_id "* ]]
          }

          read_world_clock() {
            local postgres_container="$1"
            docker exec "$postgres_container" sh -c \
              'exec psql -U "${POSTGRES_USER:-sammo}" -d "${POSTGRES_DB:-sammo}" -tA -F "$1" -c "$2"' \
              sh '|' "WITH clock_state AS (
                SELECT current_year * 100 + current_month AS visible_clock,
                       EXTRACT(EPOCH FROM COALESCE(NULLIF(meta ->> 'lastTurnTime', '')::timestamptz, start_time, now()))::bigint AS last_turn_epoch,
                       tick_seconds
                FROM world_state
              )
              SELECT visible_clock,
                     last_turn_epoch,
                     last_turn_epoch + tick_seconds,
                     EXTRACT(EPOCH FROM now())::bigint
              FROM clock_state;" 2>/dev/null
          }

          read_daemon_gate_state() {
            local engine_container="$1"
            local daemon_status paused recovery_ready

            if ! daemon_status="$(docker exec "$engine_container" wget -qO- http://localhost:8082/admin/turn-daemon/status 2>/dev/null)"; then
              echo "ERROR: ${engine_container} daemon status query failed" >&2
              return 1
            fi
            if [[ "$daemon_status" =~ \"paused\"[[:space:]]*:[[:space:]]*(true|false) ]]; then
              paused="${BASH_REMATCH[1]}"
            else
              echo "ERROR: ${engine_container} daemon status omitted paused" >&2
              return 1
            fi
            if [[ "$daemon_status" =~ \"recoveryReady\"[[:space:]]*:[[:space:]]*(true|false) ]]; then
              recovery_ready="${BASH_REMATCH[1]}"
            else
              echo "ERROR: ${engine_container} daemon status omitted recoveryReady" >&2
              return 1
            fi
            # Do not print daemon_status: it includes diagnostics that are not needed for this gate.
            printf '%s|%s\n' "$paused" "$recovery_ready"
          }

          validate_world_clock_sample() {
            local public_server="$1"
            local state="$2"
            local clock last_turn due observed

            if [[ "$state" == *$'\n'* ]]; then
              echo "ERROR: ${public_server} returned multiple world clock rows" >&2
              return 1
            fi
            IFS='|' read -r clock last_turn due observed <<< "$state"
            for value in "$clock" "$last_turn" "$due" "$observed"; do
              if [[ ! "$value" =~ ^[0-9]+$ ]]; then
                echo "ERROR: ${public_server} returned an invalid world clock sample" >&2
                return 1
              fi
            done
          }

          verify_world_clock_advance() {
            local public_server="$1"
            local postgres_container="$2"
            local engine_container="$3"
            local state gate_state paused recovery_ready
            local clock_before last_turn_before due_before observed_before
            local clock_after last_turn_after due_after observed_after
            local deadline now seconds_until_due

            state="$(read_world_clock "$postgres_container")"
            if [[ -z "$state" ]]; then
              echo "${public_server} has no world_state yet; turn-advance verification skipped"
              return 0
            fi
            validate_world_clock_sample "$public_server" "$state"
            IFS='|' read -r clock_before last_turn_before due_before observed_before <<< "$state"

            gate_state="$(read_daemon_gate_state "$engine_container")"
            IFS='|' read -r paused recovery_ready <<< "$gate_state"
            if [[ "$recovery_ready" != true ]]; then
              echo "ERROR: ${public_server} daemon recovery-gated; refusing to skip turn-advance verification" >&2
              return 1
            fi
            if [[ "$paused" == true ]]; then
              echo "${public_server} daemon paused; turn-advance verification skipped"
              return 0
            fi
            if (( observed_before < due_before )); then
              seconds_until_due=$((due_before - observed_before))
              echo "${public_server} next turn due in ${seconds_until_due}s; turn-advance verification deferred"
              return 0
            fi

            deadline=$(( $(date +%s) + 90 ))
            echo "${public_server} turn is due; polling for lastTurnTime advance"
            while true; do
              gate_state="$(read_daemon_gate_state "$engine_container")"
              IFS='|' read -r paused recovery_ready <<< "$gate_state"
              if [[ "$recovery_ready" != true ]]; then
                echo "ERROR: ${public_server} daemon recovery-gated while polling; refusing to skip turn-advance verification" >&2
                return 1
              fi
              if [[ "$paused" == true ]]; then
                echo "${public_server} daemon paused while polling; turn-advance verification skipped"
                return 0
              fi

              state="$(read_world_clock "$postgres_container")"
              if [[ -z "$state" ]]; then
                echo "${public_server} world_state became empty; turn-advance verification skipped"
                return 0
              fi
              validate_world_clock_sample "$public_server" "$state"
              IFS='|' read -r clock_after last_turn_after due_after observed_after <<< "$state"
              if [[ "$last_turn_before" != "$last_turn_after" ]]; then
                echo "${public_server} world clock: $clock_before -> $clock_after; turn-advance: OK"
                return 0
              fi

              now="$(date +%s)"
              if (( now >= deadline )); then
                echo "ERROR: ${public_server} was due and active, but lastTurnTime did not advance within 90s" >&2
                return 1
              fi
              sleep 5
            done
          }

          declare -a RUNNING_INTERNAL_SERVERS=()
          registered_servers=0
          for envf in servers/s*.env; do
            case "$envf" in *.bak*|*.example) continue;; esac
            internal_server="$(basename "$envf" .env)"
            public_server="${internal_server#s}"
            if [[ "$internal_server" != "s${public_server}" || ! "$public_server" =~ $PUBLIC_SERVER_ID_PATTERN ]]; then
              echo "Invalid or reserved game server env file: $envf" >&2
              false
            fi
            if is_reserved_public_server_id "$public_server"; then
              echo "Invalid or reserved game server env file: $envf" >&2
              false
            fi
            registered_servers=$((registered_servers + 1))

            api_container="${internal_server}-game-api"
            engine_container="${internal_server}-game-engine"
            web_container="${internal_server}-web-game"
            known_containers=0
            running_containers=0
            for container in "$api_container" "$engine_container" "$web_container"; do
              if docker ps -a --format '{{.Names}}' | grep -qx "$container"; then
                known_containers=$((known_containers + 1))
              fi
              if docker ps --format '{{.Names}}' | grep -qx "$container"; then
                running_containers=$((running_containers + 1))
              fi
            done
            if [[ "$running_containers" -eq 0 ]]; then
              if [[ "$known_containers" -eq 0 ]]; then
                echo "${public_server} (${internal_server}) not running; game-server verification skipped"
                continue
              fi
              echo "${public_server} (${internal_server}) has stopped game containers" >&2
              false
            fi
            if [[ "$known_containers" -ne 3 || "$running_containers" -ne 3 ]]; then
              echo "${public_server} (${internal_server}) has incomplete game containers" >&2
              false
            fi

            # 실패 시 무엇이 왜 죽었는지 반드시 남긴다. 이 세 줄은 2026-08-05~08 턴 데몬 차단 사고에서
            # 실제로 배포를 두 번 NO-GO 시켰지만(엔진 액추에이터 DOWN), 아무 메시지 없이 status=1 로만
            # 끝나 원인을 아무도 몰랐다. 침묵한 게이트는 안 걸린 게이트와 구분되지 않는다.
            if ! api_health="$(docker exec "$api_container" wget -qO- http://localhost:8081/actuator/health 2>&1)" \
               || ! echo "$api_health" | grep -q '"status":"UP"'; then
              echo "ERROR: ${public_server} game-api health not UP — ${api_health}" >&2
              false
            fi
            if ! engine_health="$(docker exec "$engine_container" wget -qO- http://localhost:8082/actuator/health 2>&1)" \
               || ! echo "$engine_health" | grep -q '"status":"UP"'; then
              echo "ERROR: ${public_server} game-engine health not UP — ${engine_health}" >&2
              false
            fi
            if ! curl -fsSI "http://localhost/game/${public_server}" >/dev/null; then
              echo "ERROR: ${public_server} web route http://localhost/game/${public_server} failed" >&2
              false
            fi
            echo "${public_server} (${internal_server}) API, engine, web route: OK"
            RUNNING_INTERNAL_SERVERS+=("$internal_server")
          done

          if [[ "$registered_servers" -eq 0 ]]; then
            echo "no game servers registered yet; game-server verification skipped"
          elif [[ "${#RUNNING_INTERNAL_SERVERS[@]}" -eq 0 ]]; then
            echo "no registered game servers running; game-server verification skipped"
          else
            for internal_server in "${RUNNING_INTERNAL_SERVERS[@]}"; do
              public_server="${internal_server#s}"
              verify_world_clock_advance "$public_server" "${internal_server}-game-postgres" "${internal_server}-game-engine"
            done
          fi
          echo "=== Verify done ==="
