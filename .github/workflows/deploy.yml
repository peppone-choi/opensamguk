name: Build + Deploy to EC2

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ------------------------------------------------------------------
  # 1. Build JVM artifacts
  # ------------------------------------------------------------------
  build-jvm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build + test JVM
        run: ./gradlew build --no-daemon

      - name: Surface test results
        if: always()
        run: |
          echo "== test summary =="
          find . -path '*/build/test-results/*/*.xml' -print | head -50

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push gateway-api image
        run: |
          docker build -f docker/gateway-api.Dockerfile \
            -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:gateway-api-${{ env.IMAGE_TAG }} \
            -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:gateway-api-latest .
          docker push ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:gateway-api-${{ env.IMAGE_TAG }}
          docker push ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:gateway-api-latest

      - name: Build + push game-api image
        run: |
          docker build -f docker/game-api.Dockerfile \
            -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:game-api-${{ env.IMAGE_TAG }} \
            -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:game-api-latest .
          docker push ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:game-api-${{ env.IMAGE_TAG }}
          docker push ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:game-api-latest

      - name: Build + push game-engine image
        run: |
          docker build -f docker/game-engine.Dockerfile \
            -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:game-engine-${{ env.IMAGE_TAG }} \
            -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:game-engine-latest .
          docker push ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:game-engine-${{ env.IMAGE_TAG }}
          docker push ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:game-engine-latest

  # ------------------------------------------------------------------
  # 2. Build web images
  # ------------------------------------------------------------------
  build-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [gateway, game]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push web-${{ matrix.app }} image
        run: |
          # game은 공유 도메인 에셋 충돌 방지로 assetPrefix=/game(빌드타임). gateway는 미사용(빈 값).
          ASSET_PREFIX=""
          [ "${{ matrix.app }}" = "game" ] && ASSET_PREFIX="/game"
          docker build -f docker/web-${{ matrix.app }}.Dockerfile \
            --build-arg ASSET_PREFIX="$ASSET_PREFIX" \
            -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:web-${{ matrix.app }}-${{ env.IMAGE_TAG }} \
            -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:web-${{ matrix.app }}-latest .
          docker push ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:web-${{ matrix.app }}-${{ env.IMAGE_TAG }}
          docker push ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensamguk:web-${{ matrix.app }}-latest

  # ------------------------------------------------------------------
  # 3. Deploy to EC2 — self-hosted runner ON the box (GH-hosted 러너 IP가 EC2 SG:22에 차단돼
  #    appleboy ssh/scp가 i/o timeout → 셀프호스티드 러너로 전환. deploy 잡이 박스에서 로컬 실행되어
  #    SSH/SCP 불필요. build-jvm/build-web은 GH-hosted 유지(GHCR 푸시만 필요).
  # ------------------------------------------------------------------
  deploy:
    runs-on: [self-hosted, ec2-prod]
    needs: [build-jvm, build-web]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Deploy on box
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          STACK="$HOME/opensamguk"

          # 버전관리된 nginx 정본 + bbae 오버레이를 라이브 스택으로 동기화(레포 워크스페이스→박스 cp; scp 불요).
          cp "$GITHUB_WORKSPACE/infra/nginx/default.conf" "$STACK/docker/nginx/default.conf"
          cp "$GITHUB_WORKSPACE/docker-compose.bbae.yml" "$STACK/docker-compose.bbae.yml"

          cd "$STACK"
          echo "=== GHCR login ==="   # 매 배포 재login → 박스 토큰 만료 무관.
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

          COMPOSE="docker compose -f docker-compose.production.yml -f docker-compose.bbae.yml"
          echo "=== Pulling images ==="
          $COMPOSE pull

          # Rolling restart — 업스트림 먼저, engine 다음, 빼섭, nginx 마지막(Rule A: stale-DNS 502 방지).
          echo "=== Restarting main upstreams ==="
          $COMPOSE up -d --no-deps gateway-api game-api gateway-frontend game-frontend
          sleep 5
          $COMPOSE up -d --no-deps game-engine   # engine LAST(인메모리 턴 상태 소유)

          echo "=== Starting bbae stack ==="
          $COMPOSE up -d --no-deps bbae-db bbae-redis bbae-engine bbae-api
          sleep 3
          $COMPOSE up -d --force-recreate --no-deps nginx   # nginx LAST + force-recreate(업스트림 IP 재해석)

          docker image prune -af --filter "until=168h"
          echo "=== Deploy complete ==="

      - name: Verify (health + turn-advance)
        run: |
          set -uo pipefail
          # Rule A — nginx/api health (localhost, 박스 내부).
          for i in $(seq 1 30); do
            curl -sf "http://localhost/health" >/dev/null 2>&1 && { echo "nginx health: OK"; break; }
            sleep 5
          done
          for i in $(seq 1 30); do
            RESP=$(curl -sf "http://localhost/api/game/actuator/health" 2>/dev/null || echo DOWN)
            echo "$RESP" | grep -q '"status":"UP"' && { echo "game-api actuator: OK"; break; }
            sleep 5
          done
          # Rule B — world_state clock 전진(엔진 동결 아님). 정보용(엔진 부팅 타이밍상 비차단 WARN).
          C1=$(docker exec opensamguk-db psql -U samguk -d samguk -tAc 'select current_year*100+current_month from world_state;' 2>/dev/null | tr -d ' ')
          sleep 75
          C2=$(docker exec opensamguk-db psql -U samguk -d samguk -tAc 'select current_year*100+current_month from world_state;' 2>/dev/null | tr -d ' ')
          echo "world clock: $C1 -> $C2"
          if [ -n "$C1" ] && [ "$C1" != "$C2" ]; then echo "turn-advance: OK"; else echo "WARN: clock not advancing yet ($C1 -> $C2) — 엔진 부팅 catch-up 확인 필요"; fi
          echo "=== Verify done ==="
