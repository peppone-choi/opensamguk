name: Build isolated local QA images

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Merged main source for every QA160 image (full lowercase SHA)
        required: true
        type: string

permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        surface: [gateway-api, board-api, game-api, game-engine, web-gateway, web-game]
    steps:
      - name: Validate merged source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: '[[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Confirm source CI and unchanged Dockerfiles
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ inputs.source_sha }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code HEAD -- docker
          python3 tools/ci/wait_for_main_ci.py
      - uses: actions/setup-java@v4
        if: matrix.surface == 'game-api' || matrix.surface == 'game-engine'
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        if: matrix.surface == 'game-api' || matrix.surface == 'game-engine'
        with:
          cache-read-only: true
      - name: Materialize packaged game seed through the existing path
        if: matrix.surface == 'game-api' || matrix.surface == 'game-engine'
        env:
          RTK14_STATS_JSON_B64: ${{ secrets.RTK14_STATS_JSON_B64 }}
        run: |
          bash tools/ci/build_game_jvm_images.sh enrich-internal
          ./gradlew :infra:test --no-daemon --tests 'opensamguk.infra.seed.ScenarioJsonTest.product runtime scenario declares the HWIHA new world and satisfies its seed contract'
      - name: Verify QA isolation and fixture safety
        run: python3 -m unittest discover -s tools/qa -p 'test_*.py'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.surface }}.Dockerfile
          push: true
          platforms: linux/amd64
          tags: ghcr.io/peppone-choi/opensamguk:${{ matrix.surface }}-qa160-${{ inputs.source_sha }}-${{ github.run_id }}
          labels: org.opencontainers.image.revision=${{ inputs.source_sha }}
          build-args: |
            IMAGE_TAG=${{ inputs.source_sha }}
            NEXT_PUBLIC_GATEWAY_URL=http://127.0.0.1:18300
            NEXT_PUBLIC_GAME_URL=http://127.0.0.1:18300/game/qa160
            NEXT_PUBLIC_TOPDOWN_SCREENS=1
            ASSET_PREFIX=/game
          cache-from: type=gha,scope=qa160-${{ matrix.surface }}
          cache-to: type=gha,mode=max,scope=qa160-${{ matrix.surface }}
          provenance: mode=max
